<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="application-name" content="คลังเฉลย กว.">
<title>คลังเฉลยข้อสอบ กว. สาขาโยธา</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B4F9C">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="robots" content="noindex, nofollow">

<style>
@font-face{font-family:'Sarabun';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/sarabun-thai-400-normal.woff2) format('woff2');unicode-range:U+0E01-0E5B,U+200B-200D,U+25CC}
@font-face{font-family:'Sarabun';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/sarabun-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Sarabun';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/sarabun-thai-600-normal.woff2) format('woff2');unicode-range:U+0E01-0E5B,U+200B-200D,U+25CC}
@font-face{font-family:'Sarabun';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/sarabun-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Sarabun';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/sarabun-thai-700-normal.woff2) format('woff2');unicode-range:U+0E01-0E5B,U+200B-200D,U+25CC}
@font-face{font-family:'Sarabun';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/sarabun-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface2:#F8FAFC; --ink:#0F1B2A; --muted:#52606D; --line:#D9E0E8; --line2:#C5CFDA; --ctl:#7C8998;
  --accent:#1B4F9C; --accent-ink:#FFFFFF; --accent-soft:#E6EEFA; --accent-hover:#153F7E;
  --ok:#0B7A4B; --ok-soft:#E3F4EB; --warn:#8F4A05; --warn-soft:#FCEFDB; --bad:#B42318; --bad-soft:#FDE7E5;
  --hl:#FFE58A; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --sans:'Sarabun','Noto Sans Thai','Leelawadee UI','Thonburi','Tahoma',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1218; --surface:#151D26; --surface2:#1A2430; --ink:#E8EDF2; --muted:#9AA8B6; --line:#27323E; --line2:#33414F; --ctl:#66788A;
    --accent:#7FB0F5; --accent-ink:#0B1622; --accent-soft:#1B2A3D; --accent-hover:#A3C6F8;
    --ok:#52C58E; --ok-soft:#12302A; --warn:#E3A55F; --warn-soft:#33261A; --bad:#F09088; --bad-soft:#3A1E1D; --hl:#6B5A10; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1218; --surface:#151D26; --surface2:#1A2430; --ink:#E8EDF2; --muted:#9AA8B6; --line:#27323E; --line2:#33414F; --ctl:#66788A;
  --accent:#7FB0F5; --accent-ink:#0B1622; --accent-soft:#1B2A3D; --accent-hover:#A3C6F8;
  --ok:#52C58E; --ok-soft:#12302A; --warn:#E3A55F; --warn-soft:#33261A; --bad:#F09088; --bad-soft:#3A1E1D; --hl:#6B5A10; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;font-size:16px;scroll-padding-top:70px}
html.fs-1{font-size:14.5px} html.fs-3{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.skip{position:absolute;left:-9999px;top:8px;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:8px;z-index:100;font-weight:700}
.skip:focus{left:8px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* app shell */
.app{min-height:100vh}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .brand,.nav .navfoot{display:none}
.nav .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:7px 2px 6px;font-size:.72rem;line-height:1.2;color:var(--muted);background:none;border:0;min-height:58px;position:relative}
.nav .tab .ic{width:23px;height:23px}
.nav .tab[aria-current="page"]{color:var(--accent);font-weight:700}
.nav .tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.content{min-width:0;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.bar{background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;min-height:56px;padding-top:env(safe-area-inset-top,0px)}
.bar h1{margin:0;font-size:1.15rem;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:1.35rem;height:1.35rem;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:700}
.badge.off{background:var(--warn-soft);color:var(--warn);height:auto;padding:2px 10px;font-size:.78rem}
.ib{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;color:var(--ink)}
.ib:hover{border-color:var(--accent);color:var(--accent)}
.ib[aria-expanded="true"],.ib.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.ib .badge{position:absolute;top:-6px;right:-6px}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:252px minmax(0,1fr)}
  .nav{position:sticky;top:0;height:100vh;flex-direction:column;align-items:stretch;gap:4px;padding:18px 12px;border-top:0;border-right:1px solid var(--line);overflow-y:auto}
  .nav .brand{display:flex;align-items:center;gap:12px;padding:4px 8px 16px}
  .nav .brand .logo{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
  .nav .brand b{display:block;font-size:1.05rem;line-height:1.2}
  .nav .brand span{display:block;font-size:.8rem;color:var(--muted)}
  .nav .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:1rem;padding:10px 14px;min-height:46px;border-radius:12px}
  .nav .tab:hover{background:var(--surface2)}
  .nav .tab[aria-current="page"]{background:var(--accent-soft)}
  .nav .tab[aria-current="page"]::before{display:none}
  .nav .navfoot{display:block;margin-top:auto;padding:10px 8px 0;font-size:.8rem;color:var(--muted);border-top:1px solid var(--line)}
  .content{padding-bottom:48px}
  .bar h1{font-size:1.3rem}
}

/* search bar */
.sbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 6px}
.searchrow{display:flex;gap:8px;align-items:center}
.sfield{position:relative;flex:1;min-width:0;display:flex;align-items:center}
.sfield .ic{position:absolute;left:14px;color:var(--muted);pointer-events:none}
.sfield input{width:100%;min-width:0;height:48px;padding:0 44px 0 44px;border:1.5px solid var(--ctl);border-radius:14px;background:var(--surface);font-size:1rem}
.sfield input::-webkit-search-cancel-button,.sfield input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.sfield input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.sfield .xb{position:absolute;right:4px;width:40px;height:40px;border:0;background:none;color:var(--muted);border-radius:10px;display:grid;place-items:center}
.searchrow .ib{width:48px;height:48px;border-radius:14px}
.fpanel{position:fixed;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;z-index:45;background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 40px rgba(0,0,0,.28)}
.fpanel::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--ctl);margin:-6px auto 14px}
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:44}
@media(min-width:900px){
  .fpanel{left:auto;top:0;bottom:0;right:0;width:min(440px,92vw);max-height:none;border-radius:20px 0 0 20px;padding:26px 22px;box-shadow:-12px 0 40px rgba(0,0,0,.22)}
  .fpanel::before{display:none}
}
}
.fgrp{margin-bottom:18px}
.flabel{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.fpanel select,.fpanel input.num{width:100%;height:44px;padding:0 10px;border:1px solid var(--ctl);border-radius:10px;background:var(--bg)}
.fpanel label.chk{display:flex;align-items:center;gap:8px;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--ctl);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.9rem;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.active{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.active:empty{display:none}
.achip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 6px 3px 12px;font-size:.85rem;font-weight:600}
.achip button{border:0;background:none;color:inherit;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;padding:0}
.achip button .ic{width:14px;height:14px}
main{padding:10px 0 24px;outline:none}
.count{margin:6px 2px 12px;color:var(--muted);font-size:.9rem}
.panel[hidden]{display:none}
.trainbar{margin:12px 0 8px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:8px 18px;border-radius:9px;color:var(--muted);font-weight:600;min-height:40px}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.backbar{display:flex;align-items:center;gap:8px;margin:8px 0 12px}
.backbar button{border:0;background:none;color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 6px}
.backbar .ic{transform:rotate(90deg)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 12px;box-shadow:var(--shadow)}
.meta{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;font-size:.82rem;color:var(--muted)}
.meta .srcs{display:flex;flex-direction:column;gap:2px;min-width:0}
.meta .src b{color:var(--ink);font-weight:700}
.meta details summary{cursor:pointer;color:var(--accent);list-style:none;font-weight:600}
.meta details summary::-webkit-details-marker{display:none}
.star{flex:0 0 auto;background:none;border:1px solid var(--line);border-radius:12px;width:44px;height:44px;font-size:1.15rem;line-height:1;color:var(--muted)}
.star[aria-pressed="true"]{color:#B57700;border-color:#D9A93A;background:var(--warn-soft)}
.stem{font-size:1.06rem;line-height:1.85;margin:12px 0;white-space:pre-line;overflow-wrap:anywhere}
.choices{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.choice{display:flex;align-items:flex-start;gap:12px;padding:9px 12px;border-radius:12px;border:1px solid transparent;overflow-wrap:anywhere}
.choice .no,button.opt .no{flex:0 0 1.9rem;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--bg);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:.88rem;text-align:center;margin-top:1px}
.choice .tx{white-space:pre-line;min-width:0;padding-top:1px}
.choice.empty .tx{color:var(--muted);font-size:.9rem}
.choice.correct{background:var(--ok-soft);border-color:var(--ok)}
.choice.correct .no{background:var(--ok);color:#fff}
.choice.correct .tx{font-weight:600}
.choice .mark{margin-left:auto;flex:0 0 auto;color:var(--ok);font-size:.82rem;font-weight:700;white-space:nowrap;padding-left:8px;padding-top:2px}
.notes{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:.88rem}
.note{padding:8px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink)}
.note.warn{background:var(--warn-soft)}
.note.quiet{background:none;padding:0;color:var(--muted)}
details.orig{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
details.orig summary{cursor:pointer;color:var(--accent);font-size:.92rem;font-weight:600}
details.orig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;border:1px solid var(--line)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.more{display:block;width:100%;padding:12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.acts button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:none;border-radius:10px;padding:5px 12px;font-size:.85rem;color:var(--muted);min-height:38px}
.acts button:hover{border-color:var(--accent);color:var(--accent)}
.acts .ic{width:16px;height:16px}

/* buttons & forms */
.primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:0 20px;font-weight:700;min-height:46px}
.primary:hover{background:var(--accent-hover)}
.primary[disabled]{opacity:.5;cursor:not-allowed}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);border:1px solid var(--ctl);border-radius:12px;padding:0 16px;min-height:46px;font-weight:600}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.danger{color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
button.opt{display:flex;width:100%;text-align:left;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);margin-top:6px}
button.opt:hover:not([disabled]){border-color:var(--accent)}
button.opt .tx{white-space:pre-line;min-width:0;overflow-wrap:anywhere;padding-top:1px}
button.opt.right{background:var(--ok-soft);border-color:var(--ok)} button.opt.right .no{background:var(--ok);color:#fff}
button.opt.wrong{background:var(--bad-soft);border-color:var(--bad)} button.opt.wrong .no{background:var(--bad);color:#fff}
button.opt.sel{background:var(--accent-soft);border-color:var(--accent)} button.opt.sel .no{background:var(--accent);color:var(--accent-ink)}
button.opt[disabled]{cursor:default}
.pbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;color:var(--muted);font-size:.9rem;flex-wrap:wrap}

/* empty / helper */
.empty-state{background:var(--surface);border:1px dashed var(--ctl);border-radius:16px;padding:20px}
.empty-state h2{margin:0 0 8px;font-size:1.05rem}
.empty-state p{margin:6px 0;color:var(--muted)}
.empty-state ul{margin:8px 0 12px;padding-left:1.2em;color:var(--muted)}
.ex{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ex button{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:10px;padding:6px 12px;font-size:.9rem;min-height:38px}
.warnbox{background:var(--warn-soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.88rem;color:var(--ink);margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left}
th{color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.tblwrap{overflow-x:auto}
.about h2{font-size:1.05rem;margin:22px 0 6px}
.about p,.about li{color:var(--ink)}
.about li{margin:4px 0}

/* dashboard */
.hello{margin:6px 0 14px}
.hello h2{margin:0;font-size:1.4rem}
.hello p{margin:4px 0 0;color:var(--muted)}
.fake{display:flex;align-items:center;gap:10px;width:100%;height:52px;border:1.5px solid var(--ctl);border-radius:14px;background:var(--surface);padding:0 14px;color:var(--muted);text-align:left;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.5rem;line-height:1.2}
.stat span{font-size:.82rem;color:var(--muted)}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.cta.idle{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.cta b{display:block;font-size:1.05rem}
.cta span{font-size:.88rem;opacity:.9}
.cta .primary{background:var(--surface);color:var(--accent);flex:0 0 auto;white-space:nowrap}
.cta.idle .primary{background:var(--accent);color:var(--accent-ink);flex:0 0 auto;white-space:nowrap}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:6px}
@media(min-width:640px){.quick{grid-template-columns:repeat(4,minmax(0,1fr))}}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;box-shadow:var(--shadow)}
.qa:hover{border-color:var(--accent)}
.qa .ic{width:24px;height:24px;color:var(--accent)}
.qa b{font-size:.98rem}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 8px}
.sect h3{margin:0;font-size:1.05rem}
.sect span{color:var(--muted);font-size:.85rem}
.subjgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.subj{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;box-shadow:var(--shadow)}
.subj:hover{border-color:var(--accent)}
.subj b{display:block;font-size:.95rem;line-height:1.35}
.subj span{font-size:.82rem;color:var(--muted)}
.meter{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--ok)}
.menu{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.menu button,.menu a{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink);text-decoration:none;min-height:56px}
.menu button:last-child,.menu a:last-child{border-bottom:0}
.menu .ic{color:var(--accent)}
.menu small{display:block;color:var(--muted);font-size:.82rem}
.menu .grow{flex:1;min-width:0}
.menu .go{transform:rotate(-90deg);color:var(--muted)}
.setrow{padding:14px 16px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow h3{margin:0 0 8px;font-size:.98rem}
.setrow p{margin:4px 0 0;color:var(--muted);font-size:.88rem}
.skel{background:linear-gradient(90deg,var(--line) 25%,var(--surface2) 37%,var(--line) 63%);background-size:400% 100%;border-radius:12px}
@media (prefers-reduced-motion: no-preference){.skel{animation:sk 1.4s ease infinite}@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}.card{transition:border-color .15s}}
.updbar{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between}
@media(min-width:900px){.updbar{left:auto;right:24px;bottom:24px;max-width:420px}}
.updbar button{background:var(--bg);color:var(--ink);border:0;border-radius:10px;padding:8px 14px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:90vw}
@media(min-width:900px){.toast{bottom:28px}}
.dropveil{position:fixed;inset:0;background:rgba(27,79,156,.82);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700;z-index:60;text-align:center;padding:24px}
dialog{border:0;border-radius:16px;padding:20px;max-width:min(92vw,460px);background:var(--surface);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 10px;font-size:1.1rem}
kbd{background:var(--bg);border:1px solid var(--ctl);border-bottom-width:2px;border-radius:6px;padding:1px 7px;font:inherit;font-size:.85rem}

/* image / photo panel */
.imgpanel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.imgpanel .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.imgpanel h2{margin:0;font-size:1.05rem}
.imgpanel .thumb{display:block;max-width:100%;max-height:220px;margin:10px 0;border-radius:10px;border:1px solid var(--line)}
.imgpanel textarea{width:100%;min-height:96px;background:var(--bg);border:1px solid var(--ctl);border-radius:12px;padding:10px;font:inherit}
.imgpanel .sc{color:var(--muted);font-size:.85rem;margin:8px 0 4px}
.spin{display:inline-block;width:1em;height:1em;border:2px solid var(--ctl);border-top-color:var(--accent);border-radius:50%;margin-right:8px;vertical-align:-2px}
@media (prefers-reduced-motion: no-preference){.spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
.progbar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0}
.progbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

/* exam */
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.frm label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:700;color:var(--muted)}
.frm select{height:44px;background:var(--bg);border:1px solid var(--ctl);border-radius:10px;padding:0 8px;color:var(--ink);max-width:100%;font-weight:400}
.frm label.chk{flex-direction:row;align-items:center;gap:8px;font-weight:400}
.exbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;font-weight:700;flex-wrap:wrap}
.exbar .clock{font-variant-numeric:tabular-nums;color:var(--accent)}
.exbar .clock.low{color:var(--bad)}
.prog{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--accent)}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pal button{width:40px;height:40px;border:1px solid var(--ctl);background:var(--surface);border-radius:10px;font-size:.85rem}
.pal button.done{background:var(--accent-soft);border-color:var(--accent)}
.pal button.cur{outline:3px solid var(--accent)}
.big{font-size:2.3rem;font-weight:700;line-height:1.1}
.pill{display:inline-block;padding:2px 12px;border-radius:999px;font-size:.85rem;font-weight:700;vertical-align:middle}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.hero{display:grid;gap:8px;margin-bottom:12px}

/* AI */
.aimsg{border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0;white-space:pre-wrap;word-break:break-word;line-height:1.65}
.aimsg.u{background:var(--accent-soft);border-color:var(--accent)} .aimsg.a{background:var(--surface)} .aimsg.err{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.aimsg .who{display:block;font-size:.75rem;color:var(--muted);margin-bottom:4px;font-weight:700}
.aimsg pre.code{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;overflow-x:auto;white-space:pre}
.aimsg code{background:var(--bg);padding:1px 4px;border-radius:4px}
.aimsg .copyb{margin-top:6px;border:1px solid var(--line);background:none;border-radius:8px;padding:4px 10px;font-size:.8rem;color:var(--muted)}
#aiQ{width:100%;min-height:110px;resize:vertical;background:var(--bg);color:var(--ink);border:1px solid var(--ctl);border-radius:12px;padding:12px;font:inherit}
.aicfg input,.aicfg select{background:var(--bg);color:var(--ink);border:1px solid var(--ctl);border-radius:10px;padding:0 10px;height:44px;font:inherit;width:100%}
.aicfg .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:10px 0}
.aicfg label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.aicfg label.chk{flex-direction:row;align-items:center;gap:8px}
.aicfg label.chk input{width:auto;height:auto}
.aichips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.aichips button{border:1px solid var(--ctl);background:var(--surface);border-radius:999px;padding:0 16px;font-size:.9rem;min-height:40px}
.aichips button:hover{border-color:var(--accent);color:var(--accent)}

/* print */
@media print{
  .nav,.bar,.sbar,.acts,.star,.updbar,.toast,.trainbar,.backbar,.row,.skip{display:none !important}
  body{background:#fff;color:#000} .content{padding:0} .app{display:block}
  .card{box-shadow:none;break-inside:avoid;border-color:#999} .wrap{max-width:none}
  .choice.correct{background:#e9f7ef !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalize(s){return s.toLowerCase().replace(/[\u0E47-\u0E4C]/g,'').replace(/[^\p{L}\p{N}\p{Mn}]+/gu,'');}
const fileName=i=>'กว_'+FILES[i];
function srcLabel(s){
  const [f,set,n,p,pe]=s; const pg=pe&&pe!==p?`${p}–${pe}`:p;
  if(f===0) return `<span class="src"><b>${fileName(f)}</b> (ไฟล์สแกน)${SETS['0:'+set]?' · '+esc(SETS['0:'+set]):''}${n?' · ข้อ '+n:''} · หน้า ${pg}</span>`;
  return `<span class="src"><b>${fileName(f)}</b> · ${esc(SETS[f+':'+set]||('ชุด '+set))} · ข้อ ${n} · หน้า ${pg}</span>`;
}
function hlRegex(terms){
  if(!terms.length) return null;
  const gap='[\\u0E47-\\u0E4C\\s\\p{P}\\p{S}]*';
  const parts=[...terms].sort((a,b)=>b.length-a.length).map(t=>Array.from(t).map(c=>c.replace(/[.*+?^${}()|[\]\\\/-]/g,'\\$&')).join(gap));
  try{return new RegExp(parts.join('|'),'giu');}catch(e){return null;}
}
function hl(text,re){
  if(!re) return esc(text);
  let out='',last=0,m; re.lastIndex=0;
  while((m=re.exec(text))){
    if(m[0]==='') {re.lastIndex++; continue;}
    out+=esc(text.slice(last,m.index))+'<mark>'+esc(m[0])+'</mark>'; last=m.index+m[0].length;
  }
  return out+esc(text.slice(last));
}

/* ---------- data ---------- */
function loadScript(u){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s);});}
async function inflate(b64){
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  if('DecompressionStream' in window){
    const ds=new DecompressionStream('deflate-raw');
    return await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
  }
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js');
  return new TextDecoder().decode(pako.inflateRaw(bin));
}
async function init(){
  try{
    const data=JSON.parse(await inflate(B64));
    FILES=data.files; SETS=data.sets||{};
    E=data.e.map((r,i)=>{
      const o={i,q:r[0],c:r[1],a:r[2],h:r[3],g:r[4],t:r[5],o:r[6],s:r[7],x:r[8]||'',cf:r[9]||'',tr:r[10]||0,im:r[11]||[]};
      o.nq=normalize(o.q); o.all=o.nq+'\u0001'+normalize(o.c.join(' ')); o.id=hid(o);
      o.fm=new Set(o.s.map(x=>x[0])); o.ns=new Set(o.s.map(x=>x[2])); o.sn=new Set(o.s.map(x=>SETS[x[0]+':'+x[1]]).filter(Boolean));
      return o;
    });
  }catch(err){
    $('#stat').textContent='โหลดข้อมูลไม่สำเร็จ';
    $('#results').innerHTML='<div class="empty-state"><h2>เปิดฐานข้อมูลไม่ได้</h2><p>เบราว์เซอร์นี้อาจไม่รองรับการแตกไฟล์ข้อมูล ลองเปิดด้วย Chrome, Safari หรือ Firefox เวอร์ชันล่าสุด แล้วรีเฟรชหน้า</p></div>';
    console.error(err); return;
  }
  try{MARKS=new Set(JSON.parse(localStorage.getItem('kw-marks-v1')||'[]').filter(i=>E[i]));}catch(e){MARKS=new Set();}
  HMAP=new Map(E.map(e=>[e.id,e])); WRONG=new Set(LS.get('kw-wrong-v1',[]).filter(id=>HMAP.has(id)));
  const ans=E.filter(e=>e.a&&['p','u','s2'].includes(e.h)).length;
  const calc=E.filter(e=>e.h==='c').length;
  $('#stat').textContent=`${E.length.toLocaleString('th-TH')} ข้อ · เฉลยยืนยันแล้ว ${ans.toLocaleString('th-TH')}`+(calc?` · Claude คำนวณ ${calc.toLocaleString('th-TH')}`:'');
  buildChips(); buildSubj(); renderAbout(); updateMarkCount();
}
function saveMarks(){try{localStorage.setItem('kw-marks-v1',JSON.stringify([...MARKS]));}catch(e){} updateMarkCount();}
function updateMarkCount(){$('#markCount').textContent=MARKS.size?`(${MARKS.size})`:'';}

/* ---------- filters ---------- */
function buildChips(){
  const box=$('#chips'); let h=`<button class="chip" id="chipAll" aria-pressed="true">ทุกไฟล์</button>`;
  FILES.forEach((f,i)=>{h+=`<button class="chip" data-f="${i}" aria-pressed="false">${fileName(i)}${i===0?' (สแกน)':''}</button>`;});
  box.innerHTML=h;
  box.addEventListener('click',ev=>{
    const b=ev.target.closest('.chip'); if(!b) return;
    if(b.id==='chipAll') FSEL.clear(); else {const f=+b.dataset.f; FSEL.has(f)?FSEL.delete(f):FSEL.add(f);}
    syncChips(); tab==='practice'?nextPractice():run();
  });
}
function syncChips(){
  $('#chipAll').setAttribute('aria-pressed',FSEL.size===0);
  document.querySelectorAll('.chip[data-f]').forEach(b=>b.setAttribute('aria-pressed',FSEL.has(+b.dataset.f)));
}
const inFiles=e=>FSEL.size===0||[...e.fm].some(f=>FSEL.has(f));
const inSubj=e=>!SUBJ||e.sn.has(SUBJ);
function buildSubj(){
  const names=[...new Set(Object.values(SETS))].sort((a,b)=>a.localeCompare(b));
  const sel=$('#subj'); sel.innerHTML='<option value="">ทุกวิชา</option>'+names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
  sel.addEventListener('change',()=>{SUBJ=sel.value; tab==='practice'?nextPractice():run();});
}

/* ---------- search ---------- */
let timer=null;
$('#q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(run,140);});
$('#num').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(run,140);});
$('#status').addEventListener('change',run);

function run(){
  renderActive();
  const raw=$('#q').value.trim();
  const terms=raw.split(/\s+/).map(normalize).filter(Boolean);
  const num=parseInt($('#num').value,10)||null;
  const st=$('#status').value;
  const box=$('#results');
  if(!terms.length&&!num&&FSEL.size===0&&st==='all'&&!SUBJ){ current=[]; box.innerHTML=welcome(); return; }
  const phrase=terms.join('');
  const out=[];
  for(const e of E){
    if(!inFiles(e)||!inSubj(e)) continue;
    if(num&&![...e.s].some(x=>x[2]===num&&(FSEL.size===0||FSEL.has(x[0])))) continue;
    if(st==='ans'&&!e.a) continue;
    if(st==='conf'&&!(e.a&&['p','u','s2'].includes(e.h))) continue;
    if(st==='calc'&&e.h!=='c') continue;
    if(st==='noans'&&e.a) continue;
    let sc=0;
    if(terms.length){
      if(!terms.every(t=>e.all.includes(t))) continue;
      if(e.nq.includes(phrase)) sc=4; else if(terms.every(t=>e.nq.includes(t))) sc=2; else sc=1;
    }
    if(e.o) sc-=10;
    out.push([sc,e]);
  }
  out.sort((a,b)=>b[0]-a[0]);
  current=out.map(x=>x[1]); shown=0;
  box.dataset.re=''; window.__re=hlRegex(terms);
  box.innerHTML=`<p class="count">พบ ${current.length.toLocaleString('th-TH')} รายการ</p><div id="list"></div><div id="moreBox"></div>`;
  if(!current.length){ $('#list').innerHTML=`<div class="empty-state"><h2>ไม่พบรายการที่ตรงกัน</h2><p>ลองพิมพ์คำให้สั้นลง หรือค้นด้วยคำเดียว เช่น ชื่อหัวข้อหรือค่าตัวเลขในโจทย์ ถ้าเลือกไฟล์ไว้ ให้กด "ทุกไฟล์" เพื่อค้นทั้งหมด</p></div>`; return; }
  more();
}
function more(){
  const list=$('#list'); const slice=current.slice(shown,shown+PAGE);
  list.insertAdjacentHTML('beforeend',slice.map(e=>card(e,window.__re)).join(''));
  shown+=slice.length;
  $('#moreBox').innerHTML=shown<current.length?`<button class="more" id="moreBtn">แสดงเพิ่ม (เหลืออีก ${(current.length-shown).toLocaleString('th-TH')})</button>`:'';
  const b=$('#moreBtn'); if(b) b.onclick=more;
}
function welcome(){
  return `<div class="empty-state"><h2>ค้นหาเฉลยจากโจทย์</h2>
  <p>พิมพ์คำใดก็ได้ที่อยู่ในโจทย์หรือตัวเลือก ระบบค้นโดยไม่สนไม้เอก ไม้โท หรือช่องว่าง</p>
  <ul><li>พิมพ์หลายคำ = ข้อนั้นต้องมีครบทุกคำ</li><li>ใส่ "เลขข้อ" เพื่อดูข้อตามลำดับในไฟล์ที่เลือก</li><li>กดชื่อไฟล์เพื่อจำกัดการค้นหา</li><li>มีรูปโจทย์? กด 📷 หรือวางรูป (Ctrl+V) เพื่อหาข้อที่ตรงกัน</li></ul>

/* ---------- card ---------- */
function card(e,re){
  const srcs=e.s.slice(0,2).map(srcLabel).join('');
  const rest=e.s.length>2?`<details><summary>อีก ${e.s.length-2} ที่มา</summary>${e.s.slice(2).map(srcLabel).join('')}</details>`:'';
  const pg=e.s[0][3];
  const fname=fileName(e.s[0][0]);
  let body='',notes='';
  const stem=e.q||'(โจทย์เป็นรูปภาพ ดูที่ต้นฉบับ)';
  const pgs=e.s.find(x=>x[0]===0)||e.s[0];
  const nnote=e.h==='n'?`<div class="note warn"><b>ต้นฉบับไม่มีเฉลย และ Claude ตรวจแล้วไม่พบตัวเลือกที่ถูกต้อง</b><br>${esc(e.x||'')}</div>`:'';
  const wnote=e.h==='w'?`<div class="note warn"><b>ต้นฉบับมีเฉพาะโจทย์และวิธีทำด้วยลายมือ</b> ไม่มีตัวเลือกและเลขเฉลยที่พิมพ์ไว้ ดูวิธีทำและคำตอบที่ ${fileName(0)} หน้า ${pgs[3]}</div>`:'';
  const cnote=e.h==='c'?`<div class="note warn"><b>เฉลยนี้ Claude คำนวณเอง</b> ต้นฉบับไม่มีเฉลยข้อนี้ ความมั่นใจ: ${esc(e.cf||'-')}${e.x?'<br>'+esc(e.x):''}</div>`:'';
  body=`<div class="stem">${hl(stem,re)}</div>`+(e.h==='w'?'':`<ol class="choices">`+e.c.map((c,k)=>{
    const ok=e.a===k+1;
    const txt=c?hl(c,re):'(ตัวเลือกเป็นรูปภาพหรืออ่านไม่ได้)';
    const mk=ok?(e.h==='c'?'✓ เฉลย (Claude คำนวณ)':e.h==='s1'?'✓ เฉลย (ยืนยันไม่ครบ)':'✓ เฉลย'):'';
    return `<li class="choice${ok?' correct':''}${c?'':' empty'}"><span class="no">${k+1}</span><span class="tx">${txt}</span>${mk?`<span class="mark">${mk}</span>`:''}</li>`;
  }).join('')+'</ol>');
  if(e.o){
    notes+=e.tr?`<div class="note quiet">ข้อความถอดจากภาพสแกนโดย Claude ตรวจเทียบภาพแล้ว (${fileName(0)} หน้า ${pgs[3]})</div>`:`<div class="note warn">ข้อนี้อ่านจากไฟล์สแกนด้วย OCR ข้อความอาจผิดเพี้ยน ตรวจกับ ${fileName(0)} หน้า ${pgs[3]}</div>`;
    if(e.h==='w') notes+=wnote;
    else if(e.h==='c') notes+=cnote;
    else if(e.h==='s2'&&e.tr) notes+=`<div class="note quiet">เฉลยตรวจเทียบภาพสแกนแล้ว (เลขที่พิมพ์และแถบไฮไลต์ตรงกัน)</div>`;
    else if(e.h==='s2') notes+=`<div class="note quiet">เฉลยอ่านจากภาพสแกนสองแหล่งที่ตรงกัน (เลขที่พิมพ์และแถบไฮไลต์) เทียบกับข้อที่ยืนยันแล้ว ถูกราว 94–97%</div>`;
    else if(e.h==='s1') notes+=`<div class="note warn">เฉลยอ่านจากภาพสแกนได้แหล่งเดียว ถูกราว 92% ควรตรวจซ้ำที่ต้นฉบับ</div>`;
    else notes+=`<div class="note warn">ยังยืนยันเฉลยข้อนี้ไม่ได้${e.x?' ('+esc(e.x)+')':''} ดูที่ต้นฉบับ</div>`;
  }else{
    if(!e.a) notes+=e.h==='n'?nnote:`<div class="note warn">ต้นฉบับไม่ได้ระบุเฉลยข้อนี้</div>`;
    if(e.g===2) notes+=`<div class="note">โจทย์หรือตัวเลือกบางส่วนเป็นรูป ดูรูปที่ ${fname} หน้า ${pg}</div>`;
    else if(e.g===1) notes+=`<div class="note">โจทย์อ้างถึงรูปหรือตาราง ดูที่ ${fname} หน้า ${pg}</div>`;
    if(e.t) notes+=`<div class="note warn">ต้นฉบับอาจถูกตัดที่หน้าสุดท้าย ข้อความอาจไม่ครบ</div>`;
    if(e.a&&e.h==='c') notes+=cnote;
    else if(e.a) notes+=`<div class="note quiet">${e.h==='u'?'เฉลยอ่านจากเส้นใต้ตัวเลือกในต้นฉบับ':'เฉลยตามที่พิมพ์ไว้ในต้นฉบับ'}</div>`;
  }
  const acts='<div class="acts"><button type="button" data-act="copy" data-i="'+e.i+'">'+ico('copy')+'คัดลอก</button><button type="button" data-act="ai" data-i="'+e.i+'">'+ico('chat')+'ถาม AI</button>'+(/^https?:/.test(location.protocol)?'<button type="button" data-act="link" data-i="'+e.i+'">'+ico('share')+'ลิงก์</button>':'')+(REPO_URL?'<button type="button" data-act="report" data-i="'+e.i+'">'+ico('flag')+'แจ้งข้อผิด</button>':'')+'</div>';
  let orig='';
  if(IMG_BASE&&e.im&&e.im.length){
    orig='<div class="origs">'+e.im.map(n=>{
      const m=/^t_(\d+)_(\d+)$/.exec(n), s=/^s_(\d+)_(\d+)$/.exec(n);
      const lab=m?`${fileName(+m[1])} หน้า ${m[2]}`:s?`${fileName(0)} หน้า ${s[1]} (ภาพตัดเฉพาะข้อนี้)`:n;
      return `<details class="orig"><summary>🖼 ดูรูปต้นฉบับ: ${esc(lab)}</summary><a href="${IMG_BASE}${n}.webp" target="_blank" rel="noopener" aria-label="เปิดรูปต้นฉบับ ${esc(lab)} ในแท็บใหม่"><img loading="lazy" alt="รูปต้นฉบับ ${esc(lab)}" src="${IMG_BASE}${n}.webp"></a></details>`;
    }).join('')+'</div>';
  }
  return `<article class="card"><div class="meta"><div class="srcs">${srcs}${rest}</div>
  <button class="star" data-i="${e.i}" aria-pressed="${MARKS.has(e.i)}" aria-label="บันทึกข้อนี้" title="บันทึกไว้ทบทวน">★</button></div>
  ${body}${notes?`<div class="notes">${notes}</div>`:''}${orig}${acts}</article>`;
}

let pcur=null, pscore={ok:0,n:0};
function pool(){ if(PSR) return PSR; return E.filter(e=>!e.o&&e.a&&e.h!=='c'&&e.q&&e.c.every(Boolean)&&inFiles(e)&&inSubj(e)&&(!$('#skipFig').checked||e.g===0));}
function nextPractice(){
  renderActive();
  if(PSR&&!PSR.length){PSR=null; $('#p-practice').innerHTML='<div class="empty-state"><h2>ทบทวนครบแล้ววันนี้</h2><p>เก่งมาก ข้อที่ผิดจะกลับมาทบทวนตามรอบถัดไป</p><div class="row"><button class="primary" id="goHome" type="button">กลับหน้าหลัก</button></div></div>'; $('#goHome').onclick=()=>switchTab('home'); return;}
  const P=pool(), box=$('#p-practice');
  if(!P.length){box.innerHTML='<div class="empty-state"><h2>ไม่มีข้อให้ฝึก</h2><p>ลองเลือกไฟล์อื่น หรือปิดตัวเลือก "ข้ามข้อที่ต้องดูรูป"</p></div>'; return;}
  pcur=P[Math.floor(Math.random()*P.length)];
  const e=pcur;
  box.innerHTML=`<div class="pbar"><span>${PSR?'โหมดทบทวนตามรอบ · เหลือ ':'ข้อที่ให้ฝึกได้ '}${P.length.toLocaleString('th-TH')} ข้อ</span><span>ตอบถูก ${pscore.ok} จาก ${pscore.n}</span></div>
  <article class="card"><div class="stem" style="margin-top:0">${esc(e.q)}</div>
  <div class="choices" id="popts">${e.c.map((c,k)=>`<button class="opt" data-k="${k+1}"><span class="no">${k+1}</span><span class="tx">${esc(c)}</span></button>`).join('')}</div>
  <div id="pfb"></div></article>`;
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('#p-practice button.opt'); if(!b||!pcur) return;
  const k=+b.dataset.k, e=pcur;
  document.querySelectorAll('#popts .opt').forEach(x=>{x.disabled=true; const kk=+x.dataset.k; if(kk===e.a) x.classList.add('right'); else if(kk===k) x.classList.add('wrong');});
  pscore.n++; if(k===e.a) pscore.ok++; statAdd(1,k===e.a?1:0); srAnswer(e,k===e.a); if(PSR) PSR=PSR.filter(x=>x!==e);
  $('#pfb').innerHTML=`<div class="notes"><div class="note ${k===e.a?'':'warn'}">${k===e.a?'ถูกต้อง':'ยังไม่ถูก เฉลยคือข้อ '+e.a}</div><div class="note quiet">${e.s.slice(0,2).map(srcLabel).join(' ')}</div></div>
  <div class="row"><button class="primary" id="pnext">ข้อต่อไป</button><button class="ghost star" data-i="${e.i}" aria-pressed="${MARKS.has(e.i)}" style="width:auto;padding:0 14px">★ บันทึกไว้</button></div>`;
  $('#pnext').onclick=nextPractice; $('#pnext').focus();
});
$('#skipFig').addEventListener('change',nextPractice);

function buildInv(){
  INV=new Map();
  E.forEach((e,id)=>{
    const s=e.all.replace('\u0001',''); const seen=new Set();
    for(let i=0;i<s.length-2;i++){const g=s.substr(i,3); if(seen.has(g)) continue; seen.add(g); let a=INV.get(g); if(!a){a=[];INV.set(g,a);} a.push(id);}
    e.tn=seen.size||1;
  });
}
function matchText(text){
  if(!INV) buildInv();
  const n=normalize(text); if(n.length<8) return [];
  const qs=new Set(); for(let i=0;i<n.length-2;i++) qs.add(n.substr(i,3));
  const hit=new Map();
  for(const g of qs){const a=INV.get(g); if(a) for(const id of a) hit.set(id,(hit.get(id)||0)+1);}
  const out=[];
  for(const [id,c] of hit){const e=E[id]; const s1=c/qs.size, s2=c/e.tn; if(s1>=0.28) out.push([0.75*s1+0.25*s2,s1,e]);}
  out.sort((a,b)=>b[0]-a[0]); return out.slice(0,6);
}

async function getOcr(onStatus){
  if(ocrWorker) return ocrWorker;
  if(!ocrLoading){
    ocrLoading=(async()=>{
      await loadScript(absURL(OCR_BASE+'tesseract/tesseract.min.js'));
      const w=await Tesseract.createWorker(['tha','eng'],1,{
        workerPath:absURL(OCR_BASE+'tesseract/worker.min.js'),
        corePath:absURL(OCR_BASE+'tesseract'),

  }

}
function fileToImage(file){
  return new Promise((ok,no)=>{ const u=URL.createObjectURL(file); const im=new Image(); const tm=setTimeout(()=>no(new Error('timeout')),10000); im.onload=()=>{clearTimeout(tm);ok(im);}; im.onerror=()=>{clearTimeout(tm);no(new Error('image'));}; im.src=u; });
}
async function prepImage(file){
  try{
    const im=await fileToImage(file); let w=im.naturalWidth,h=im.naturalHeight; if(!w||!h) return file;
    const long=Math.max(w,h), short=Math.min(w,h); let sc=1;
    if(long>2200) sc=2200/long; else if(short<700) sc=Math.min(2,900/short);
    const cv=document.createElement('canvas'); cv.width=Math.round(w*sc); cv.height=Math.round(h*sc);
    const cx=cv.getContext('2d'); if(!cx) return file;
    cx.drawImage(im,0,0,cv.width,cv.height);
    const d=cx.getImageData(0,0,cv.width,cv.height), px=d.data; const hist=new Uint32Array(256);
    for(let i=0;i<px.length;i+=4){ const g=(px[i]*0.299+px[i+1]*0.587+px[i+2]*0.114)|0; px[i]=px[i+1]=px[i+2]=g; hist[g]++; }
    const total=cv.width*cv.height; let lo=0,hi=255,acc=0;
    for(let i=0;i<256;i++){acc+=hist[i]; if(acc>total*0.01){lo=i;break;}} acc=0;
    for(let i=255;i>=0;i--){acc+=hist[i]; if(acc>total*0.01){hi=i;break;}}
    if(hi-lo>40){ const k=255/(hi-lo); for(let i=0;i<px.length;i+=4){ const v=Math.max(0,Math.min(255,((px[i]-lo)*k)|0)); px[i]=px[i+1]=px[i+2]=v; } }
    cx.putImageData(d,0,0); return cv;
  }catch(e){ return file; }

function startExam(subj,n,perQ,onlyWrong){
  const pool=shuffle(examPool(subj,onlyWrong)); if(!pool.length){toast('ไม่มีข้อที่เข้าเงื่อนไข');return;}
  const qs=pool.slice(0,Math.min(n,pool.length));
  EX={qs,ans:qs.map(()=>0),idx:0,t0:Date.now(),limit:perQ?Math.round(perQ*60*qs.length):0,done:false};
  clearInterval(exTimer); exTimer=setInterval(tickExam,1000); renderExamQ();
}
function tickExam(){
  if(!EX||EX.done){clearInterval(exTimer);return;}
  const el=$('#exClock'); if(!el) return; const used=(Date.now()-EX.t0)/1000;
  if(EX.limit){ const left=EX.limit-used; el.textContent='เหลือ '+fmtTime(left); el.classList.toggle('low',left<60); if(left<=0){ finishExam(true); } }
  else el.textContent='ใช้เวลา '+fmtTime(used);
}
function renderExamQ(){
  const box=$('#p-exam'), i=EX.idx, e=EX.qs[i], n=EX.qs.length, done=EX.ans.filter(Boolean).length;
  let h='<div class="exbar"><span>ข้อ '+(i+1)+' / '+n+'</span><span class="clock" id="exClock"></span><button class="ghost" id="exSubmit" type="button">ส่งข้อสอบ ('+done+'/'+n+')</button></div>';

  h+='<article class="card"><div class="stem" style="margin-top:0">'+esc(e.q)+'</div><div class="choices">'+e.c.slice(0,4).map((c,k)=>'<button class="opt'+(EX.ans[i]===k+1?' sel':'')+'" data-k="'+(k+1)+'" type="button"><span class="no">'+(k+1)+'</span><span class="tx">'+esc(c)+'</span></button>').join('')+'</div></article>';
  h+='<div class="row"><button class="ghost" id="exPrev" type="button"'+(i===0?' disabled':'')+'>ก่อนหน้า</button><button class="primary" id="exNext" type="button">'+(i===n-1?'ตรวจทานแล้วส่ง':'ถัดไป')+'</button></div>';
  h+='<div class="pal">'+EX.qs.map((_,k)=>'<button type="button" data-go="'+k+'" class="'+(EX.ans[k]?'done ':'')+(k===i?'cur':'')+'" aria-label="ไปข้อ '+(k+1)+'">'+(k+1)+'</button>').join('')+'</div>';
  box.innerHTML=h; tickExam();
  box.querySelectorAll('button.opt').forEach(b=>b.onclick=()=>{ EX.ans[i]=(EX.ans[i]===+b.dataset.k)?0:+b.dataset.k; renderExamQ(); });
  box.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{EX.idx=+b.dataset.go;renderExamQ();window.scrollTo({top:0});});
  $('#exPrev').onclick=()=>{ if(EX.idx>0){EX.idx--;renderExamQ();window.scrollTo({top:0});} };
  $('#exNext').onclick=()=>{ if(EX.idx<n-1){EX.idx++;renderExamQ();window.scrollTo({top:0});} else finishExam(false); };
  $('#exSubmit').onclick=()=>finishExam(false);
}
function finishExam(timeUp){
  if(!EX||EX.done) return;
  const left=EX.ans.filter(a=>!a).length;
  if(!timeUp&&left&&!confirm('ยังไม่ได้ตอบอีก '+left+' ข้อ ส่งข้อสอบเลยไหม?')) return;
  EX.done=true; clearInterval(exTimer);
  const secs=Math.round((Date.now()-EX.t0)/1000), n=EX.qs.length; let ok=0; const per={};
  EX.qs.forEach((e,i)=>{ const s=subjOf(e); per[s]=per[s]||{n:0,ok:0}; per[s].n++; const right=EX.ans[i]===e.a; srAnswer(e,right); if(right){ok++;per[s].ok++;WRONG.delete(e.id);} else WRONG.add(e.id); });

  const hist=LS.get('kw-hist-v1',[]); hist.push({t:Date.now(),n,ok,sec:secs}); LS.set('kw-hist-v1',hist.slice(-50));

function fileToDataURL(file,maxSide){
  return new Promise(async res=>{
    try{
      const im=await fileToImage(file); let w=im.naturalWidth,h=im.naturalHeight; if(!w||!h) throw 0;
      const sc=Math.min(1,maxSide/Math.max(w,h)); const cv=document.createElement('canvas'); cv.width=Math.round(w*sc); cv.height=Math.round(h*sc);
      const cx=cv.getContext('2d'); if(!cx) throw 0; cx.drawImage(im,0,0,cv.width,cv.height); res(cv.toDataURL('image/jpeg',0.85));
    }catch(e){ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>res(null); fr.readAsDataURL(file); }
  });
}
async function aiCall(hist,ctl,onText){
  const eng=aiEngine();
  if(eng==='claude'){
    const turns=[{role:'user',content:AISYS+'\n\n(บทสนทนาต่อเนื่อง ตอบตามคำแนะนำข้างต้น)'},{role:'assistant',content:'รับทราบ'}].concat(hist.map(m=>({role:m.role,content:m.text})));
    const last=[...hist].reverse().find(m=>m.img);
    const opts={signal:ctl.signal,cache:false,onText:t=>onText(t.text)}; if(last&&last.img) opts.images=last.img;
    const r=await SAMPLE(turns,opts); return r.text||'';
  }
  const ep=aiEndpoint(), key=AI.cfg.key, model=AI.cfg.model;
  if(!key&&ep.kind==='gemini') { const er=new Error('nokey'); er.code='nokey'; throw er; }
  if(!model){ const er=new Error('nomodel'); er.code='nomodel'; throw er; }
  if(ep.kind==='gemini'){
    const contents=[];
    for(const m of hist){ const parts=[{text:m.text}]; if(m.img){ const d=await fileToDataURL(m.img,1600); if(d){ const mm=/^data:([^;]+);base64,(.*)$/.exec(d); if(mm) parts.push({inlineData:{mimeType:mm[1],data:mm[2]}}); } } contents.push({role:m.role==='assistant'?'model':'user',parts}); }
    const j=await aiFetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({systemInstruction:{parts:[{text:AISYS}]},contents,generationConfig:{temperature:0.2}}),signal:ctl.signal});
    const c=j.candidates&&j.candidates[0]; const t=c&&c.content&&c.content.parts?c.content.parts.map(p=>p.text||'').join(''):'';
    if(!t){ const er=new Error('empty'); er.code='empty'; er.detail=(j.promptFeedback&&j.promptFeedback.blockReason)||(c&&c.finishReason)||''; throw er; }
    return t;
  }
  if(!ep.base){ const er=new Error('nobase'); er.code='nobase'; throw er; }
  const messages=[{role:'system',content:AISYS}];
  for(const m of hist){ if(m.img){ const d=await fileToDataURL(m.img,1600); messages.push({role:m.role,content:[{type:'text',text:m.text}].concat(d?[{type:'image_url',image_url:{url:d}}]:[])}); } else messages.push({role:m.role,content:m.text}); }
  const j=await aiFetch(ep.base+'/chat/completions',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},key?{Authorization:'Bearer '+key}:{}),body:JSON.stringify({model,messages,temperature:0.2}),signal:ctl.signal});
  const t=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content; if(!t){ const er=new Error('empty'); er.code='empty'; throw er; } return t;
}

async function aiSend(){
  if(AI.busy) return; const q=$('#aiQ').value.trim(); if(!q&&!AI.img) return;
  const eng=aiEngine(); if(!eng){ toast('ยังไม่ได้ตั้งค่าแชท ใช้ปุ่มคัดลอกไปแชทเว็บด้านล่างได้'); return; }
  const ctx=$('#aiCtx').checked?aiCtx(q):''; const text=(q||'(ดูรูปที่แนบ)')+(ctx?'\n\n=== '+ctx:'');
  AI.msgs.push({role:'user',text,disp:q,img:AI.img}); AI.img=null; $('#aiQ').value=''; $('#aiImgName').textContent='';
  AI.busy=true; AI.ctl=new AbortController(); aiRenderLog(); $('#aiSend').disabled=true; $('#aiStop').hidden=false;
  const hist=AI.msgs.filter(m=>!m.err).slice(-9);
  try{
    const out=await aiCall(hist,AI.ctl,t=>aiRenderLog(t));
    AI.msgs.push({role:'assistant',text:out});
  }catch(e){
    let m;
    if(e&&e.code==='cancelled'||e&&e.name==='AbortError') m='หยุดการตอบแล้ว';
    else if(e&&e.code==='nokey') m='ยังไม่ได้ใส่คีย์ ใส่คีย์ในหัวข้อ "ตั้งค่าแชท" ก่อน';
    else if(e&&e.code==='nomodel') m='ยังไม่ได้เลือกโมเดล กด "โหลดรายชื่อโมเดล" แล้วเลือก';
    else if(e&&e.code==='nobase') m='ยังไม่ได้ใส่ที่อยู่ API (Base URL)';
    else if(e&&e.code==='net') m='เชื่อมต่อผู้ให้บริการไม่ได้ (อาจถูกบล็อกโดย CORS/ภูมิภาค หรืออินเทอร์เน็ตมีปัญหา) ลองผู้ให้บริการอื่น หรือใช้ปุ่มคัดลอกไปแชทเว็บ';
    else if(e&&e.code==='empty') m='AI ไม่ตอบข้อความกลับมา'+(e.detail?' ('+e.detail+')':'')+' ลองถามใหม่หรือเปลี่ยนโมเดล';
    else if(e&&e.code==='http') m=aiErrMsg(e.status,e.body);
    else if(e&&e.code==='not_granted') m='คุณไม่ได้อนุญาตให้ใช้ Claude ในหน้านี้';
    else if(e&&e.code==='rate_limited') m='ใช้ Claude ถี่เกินไป รอสักครู่แล้วลองใหม่';
    else m=(e&&e.message)||'เกิดข้อผิดพลาด';
    AI.msgs.push({role:'assistant',text:m,err:true});
  }finally{ AI.busy=false; AI.ctl=null; $('#aiSend').disabled=false; $('#aiStop').hidden=true; aiRenderLog(); const b=$('#aiLog'); if(b) b.scrollIntoView({block:'end'}); }
}

function togglePanel(btn){
  const fp=$('#filterPanel'); const open=fp.hidden; fp.hidden=!open; $('#sheetBg').hidden=!open;
  $$('.filtToggle').forEach(b=>{b.setAttribute('aria-expanded',String(open&&!b.hidden)); b.classList.toggle('on',open&&!b.hidden);});
}
function closePanel2(){ const fp=$('#filterPanel'); if(fp) fp.hidden=true; const sb=$('#sheetBg'); if(sb) sb.hidden=true; $$('.filtToggle').forEach(b=>{b.setAttribute('aria-expanded','false');b.classList.remove('on');}); }
function initShell(){
  $('#nav').addEventListener('click',ev=>{const b=ev.target.closest('.tab'); if(b) switchTab(b.dataset.tab);});
  $$('.seg button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
  $('#backBtn').onclick=()=>switchTab(backTo);
  $$('.filtToggle').forEach(b=>b.addEventListener('click',()=>togglePanel(b)));
  $('#sheetBg').onclick=closePanel2; $('#fDone').onclick=closePanel2;
  $('#fReset').onclick=()=>{ FSEL.clear(); SUBJ=''; $('#subj').value=''; $('#status').value='all'; $('#num').value=''; syncChips(); tab==='practice'?nextPractice():run(); };
  $('#activeChips').addEventListener('click',ev=>{ const b=ev.target.closest('[data-rm]'); if(!b) return; const k=b.dataset.rm;
    if(k==='f'){ const c=document.querySelector('.chip[data-f="'+b.dataset.v+'"]'); if(c) c.click(); }
    else if(k==='s'){ $('#subj').value=''; SUBJ=''; run(); }
    else if(k==='st'){ $('#status').value='all'; run(); }
    else if(k==='n'){ $('#num').value=''; run(); } });
  const q=$('#q'), qc=$('#qclear'); q.addEventListener('input',()=>{qc.hidden=!q.value;}); qc.onclick=()=>{q.value='';qc.hidden=true;run();q.focus();};
  $('#kbdClose').onclick=()=>{const d=$('#kbd'); if(d.close) d.close();};
  const fs=LS.get('kw-fs',2); applyFs(fs);
  window.addEventListener('offline',()=>{$('#offBadge').hidden=false;}); window.addEventListener('online',()=>{$('#offBadge').hidden=true;});
  if(!navigator.onLine) $('#offBadge').hidden=false;
  document.addEventListener('keydown',ev=>{
    const t=ev.target, typing=t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable);
    if(ev.ctrlKey||ev.metaKey||ev.altKey) return;
    if(ev.key==='Escape'&&t&&t.id==='q'){ q.value=''; qc.hidden=true; run(); return; }
    if(typing) return;
    if(ev.key==='/'){ ev.preventDefault(); switchTab('search'); q.focus(); }
    else if(ev.key==='?'){ ev.preventDefault(); const d=$('#kbd'); if(d&&d.showModal) d.showModal(); }
    else if(/^[1-4]$/.test(ev.key)&&(tab==='practice'||tab==='exam')){ const b=document.querySelector((tab==='practice'?'#p-practice':'#p-exam')+' button.opt[data-k="'+ev.key+'"]'); if(b&&!b.disabled) b.click(); }
    else if(ev.key==='Enter'&&tab==='practice'){ const b=$('#pnext'); if(b) b.click(); }
    else if(tab==='exam'&&EX&&!EX.done&&(ev.key==='ArrowRight'||ev.key==='ArrowLeft')){ const b=$(ev.key==='ArrowRight'?'#exNext':'#exPrev'); if(b&&!b.disabled) b.click(); }
  });
}
function applyFs(n){ n=+n||2; document.documentElement.classList.remove('fs-1','fs-3'); if(n===1) document.documentElement.classList.add('fs-1'); if(n===3) document.documentElement.classList.add('fs-3'); }
function showFG(isSearch){ ['#searchOpts','#numRow'].forEach(s=>{const el=$(s); if(el) el.hidden=!isSearch;}); $('#practiceOpts').hidden=isSearch; }

function switchTab(name){
  if(!TITLES[name]) name='home'; tab=name;
  $$('.nav .tab').forEach(x=>{ if(x.dataset.tab===GROUP[name]) x.setAttribute('aria-current','page'); else x.removeAttribute('aria-current'); });
  $$('.seg button').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.tab===name)));
  ['home','search','practice','exam','ai','more','marks','settings','about'].forEach(k=>{const p=$('#p-'+k); if(p) p.hidden=(k!==name);});
  $('#pageTitle').textContent=TITLES[name]; document.title=(name==='home'?'':TITLES[name]+' · ')+'คลังเฉลยข้อสอบ กว. สาขาโยธา';
  $('#sbar').hidden=name!=='search';
  $('#trainbar').hidden=!(name==='practice'||name==='exam');
  $('#filtBtnP').hidden=name!=='practice';
  const sub=(name==='marks'||name==='settings'||name==='about'); $('#backbar').hidden=!sub;
  closePanel2();
  if(name==='search'){ moveFilters($('#filterHostS')); showFG(true); run(); }
  else if(name==='practice'){ moveFilters($('#filterHostP')); showFG(false); if(!REVIEW_ON) PSR=null; REVIEW_ON=false; nextPractice(); }
  renderActive();
  if(name==='home') renderHome();
  else if(name==='more') renderMore();
  else if(name==='marks') renderMarks();
  else if(name==='settings') renderSettings();
  else if(name==='exam'&&!EX) renderExamSetup();
  window.scrollTo({top:0});
}

/* --- home dashboard --- */
function renderHome(){
  const box=$('#p-home'); const tot=E.length; const conf=E.filter(e=>e.a&&['p','u','s2'].includes(e.h)).length;
  const s=LS.get('kw-stats-v1',{}), td=s[todayStr()]||{n:0,ok:0}, due=srDue().length;
  const sub=LS.get('kw-subj-v1',{}); const counts=new Map(); E.forEach(e=>e.sn.forEach(n=>counts.set(n,(counts.get(n)||0)+1)));
  let h='<div class="hello"><h2>เตรียมสอบ กว. อย่างเป็นระบบ</h2><p>คลังเฉลยข้อสอบวิศวกรรมโยธา ค้นหา ฝึกทำ สอบจำลอง และทบทวนตามรอบ</p></div>';
  h+='<button class="fake" id="homeSearch" type="button">'+ico('search')+'<span>ค้นหาจากคำในโจทย์ เลขข้อ หรือรูปโจทย์…</span></button>';
  h+='<div class="stats"><div class="stat"><b>'+tot.toLocaleString('th-TH')+'</b><span>ข้อในคลัง</span></div><div class="stat"><b>'+Math.round(100*conf/tot)+'%</b><span>เฉลยยืนยันแล้ว</span></div><div class="stat"><b>'+td.n+'</b><span>ข้อที่ทำวันนี้'+(td.n?' · ถูก '+td.ok:'')+'</span></div><div class="stat"><b>'+streak()+'</b><span>วันติดต่อกัน</span></div></div>';
  h+=due?'<div class="cta"><div><b>ทบทวนวันนี้ '+due+' ข้อ</b><span>ข้อที่เคยตอบผิดและถึงรอบทบทวนแล้ว</span></div><button class="primary" id="startReview" type="button">เริ่มทบทวน</button></div>':'<div class="cta idle"><div><b>ยังไม่มีข้อที่ต้องทบทวน</b><span>ข้อที่ตอบผิดจะกลับมาทบทวนตามรอบ 1, 3, 7, 14 และ 30 วัน</span></div><button class="primary" id="goPractice" type="button">ฝึกทำ</button></div>';
  h+='<div class="quick"><button class="qa" data-go="search" type="button">'+ico('search')+'<b>ค้นหาข้อสอบ</b></button><button class="qa" data-go="practice" type="button">'+ico('target')+'<b>ฝึกทำ</b></button><button class="qa" data-go="exam" type="button">'+ico('clip')+'<b>สอบจำลอง</b></button><button class="qa" data-go="ai" type="button">'+ico('chat')+'<b>ถาม AI</b></button></div>';
  const names=[...counts.keys()].sort((a,b)=>a.localeCompare(b));
  h+='<div class="sect"><h3>เลือกตามวิชา</h3><span>'+names.length+' วิชา</span></div><div class="subjgrid">'+names.map(n=>{const st=sub[n]; const pct=st?Math.round(100*st.ok/Math.max(1,st.n)):null; return '<button class="subj" data-subj="'+esc(n)+'" type="button"><b>'+esc(n.replace(/\s*\(.*$/,''))+'</b><span>'+counts.get(n).toLocaleString('th-TH')+' ข้อ'+(st?' · ทำแล้ว '+st.n+' · ถูก '+pct+'%':'')+'</span>'+(st?'<div class="meter" aria-hidden="true"><i style="width:'+pct+'%"></i></div>':'')+'</button>';}).join('')+'</div>';
  box.innerHTML=h;
}
document.addEventListener('click',ev=>{
  const g=ev.target.closest('#p-home [data-go]'); if(g){ switchTab(g.dataset.go); return; }
  if(ev.target.closest('#homeSearch')){ switchTab('search'); $('#q').focus(); return; }
  if(ev.target.closest('#startReview')){ startReview(); return; }
  if(ev.target.closest('#goPractice')){ switchTab('practice'); return; }
  const s=ev.target.closest('#p-home [data-subj]'); if(s){ SUBJ=s.dataset.subj; const sel=$('#subj'); if(sel) sel.value=SUBJ; FSEL.clear(); syncChips(); switchTab('search'); return; }
  const rp=ev.target.closest('[data-act="report"]'); if(rp&&REPO_URL){ const e=E[+rp.dataset.i]; if(!e) return; const s0=e.s[0];
    const title='แจ้งข้อผิด: '+fileName(s0[0])+' ข้อ '+s0[2]+' หน้า '+s0[3];
    const body='รหัสข้อ: '+e.id+'\nที่มา: '+fileName(s0[0])+(SETS[s0[0]+':'+s0[1]]?' · '+SETS[s0[0]+':'+s0[1]]:'')+' · ข้อ '+s0[2]+' · หน้า '+s0[3]+'\nเฉลยในแอป: '+(e.a?'ข้อ '+e.a:'ไม่มี')+'\n\nสิ่งที่พบ (เช่น เฉลยผิด ข้อความเพี้ยน):\n\n\nโจทย์ (ตัดมา):\n'+(e.q||'').slice(0,200);
    try{window.open(REPO_URL+'/issues/new?title='+encodeURIComponent(title)+'&body='+encodeURIComponent(body),'_blank','noopener');}catch(err){} }
});

/* --- more menu / settings --- */
function renderMore(){
  const box=$('#p-more');
  const item=(go,icon,t,sm)=>'<button type="button" data-more="'+go+'">'+ico(icon)+'<span class="grow"><b>'+t+'</b><small>'+sm+'</small></span>'+ico('down').replace('class="ic"','class="ic go"')+'</button>';
  let h='<div class="menu">'+item('marks','bookmark','บันทึกไว้',MARKS.size?MARKS.size+' ข้อ':'ยังไม่มีข้อที่บันทึก')+item('settings','gear','ตั้งค่าและสำรองข้อมูล','ธีม ขนาดตัวอักษร สำรอง/กู้คืนสถิติและข้อที่บันทึก')+item('about','info','เกี่ยวกับข้อมูล','ที่มา ความน่าเชื่อถือของเฉลย ข้อจำกัด');
  if(REPO_URL) h+='<a href="'+REPO_URL+'/issues/new" target="_blank" rel="noopener">'+ico('flag')+'<span class="grow"><b>แจ้งข้อผิดหรือเสนอแนะ</b><small>เปิดหน้าแจ้งปัญหาบน GitHub</small></span>'+ico('down').replace('class="ic"','class="ic go"')+'</a>';
  h+='<button type="button" data-more="kbd">'+ico('sliders')+'<span class="grow"><b>ปุ่มลัด</b><small>กด ? ได้ทุกหน้าเมื่อใช้คีย์บอร์ด</small></span>'+ico('down').replace('class="ic"','class="ic go"')+'</button></div>';
  h+='<p class="count" style="text-align:center;margin-top:16px">เวอร์ชันแอป '+APP_VER+' · ข้อมูลล่าสุด '+DATA_DATE+'<br>ข้อสอบเป็นของสภาวิศวกร ใช้เพื่อการเตรียมสอบ</p>';
  box.innerHTML=h;
  box.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{ const g=b.dataset.more; if(g==='kbd'){const d=$('#kbd'); if(d.showModal) d.showModal();} else { backTo='more'; switchTab(g); } });
}
function renderSettings(){
  const box=$('#p-settings'); const th=LS.get('kw-theme',null), fs=+LS.get('kw-fs',2)||2;
  const seg=(id,opts,cur)=>'<div class="seg" id="'+id+'" role="radiogroup">'+opts.map(([v,l])=>'<button type="button" role="radio" data-v="'+v+'" aria-checked="'+(String(cur)===String(v))+'" aria-selected="'+(String(cur)===String(v))+'">'+l+'</button>').join('')+'</div>';
  let h='<div class="menu">';
  h+='<div class="setrow"><h3>ธีมสี</h3>'+seg('segTheme',[['auto','อัตโนมัติ'],['light','สว่าง'],['dark','มืด']],th||'auto')+'<p>อัตโนมัติจะตามการตั้งค่าของอุปกรณ์</p></div>';
  h+='<div class="setrow"><h3>ขนาดตัวอักษร</h3>'+seg('segFs',[[1,'เล็ก'],[2,'ปกติ'],[3,'ใหญ่']],fs)+'</div>';
  h+='<div class="setrow"><h3>สำรองและกู้คืนข้อมูล</h3><p>สถิติ ข้อที่บันทึก ข้อที่เคยผิด และรอบทบทวน เก็บในเบราว์เซอร์เครื่องนี้เท่านั้น ใช้ไฟล์สำรองเพื่อย้ายไปเครื่องอื่นหรือกันข้อมูลหาย (ไม่รวมคีย์ AI)</p><div class="row"><button class="ghost" id="bkExport" type="button">'+ico('download')+'ดาวน์โหลดไฟล์สำรอง</button><button class="ghost" id="bkImport" type="button">'+ico('upload')+'นำเข้าไฟล์สำรอง</button><input type="file" id="bkFile" accept="application/json,.json" hidden></div></div>';
  h+='<div class="setrow"><h3>ล้างข้อมูลในเครื่องนี้</h3><p>ลบสถิติ ข้อที่บันทึก รอบทบทวน และการตั้งค่าทั้งหมด (ไม่กระทบข้อสอบในคลัง)</p><div class="row"><button class="ghost danger" id="bkReset" type="button">'+ico('trash')+'ล้างข้อมูลทั้งหมด</button></div></div>';
  h+='</div><p class="count" style="text-align:center;margin-top:14px">เวอร์ชันแอป '+APP_VER+' · ข้อมูลล่าสุด '+DATA_DATE+'</p>';
  box.innerHTML=h;
  $('#segTheme').onclick=ev=>{const b=ev.target.closest('button'); if(!b) return; const v=b.dataset.v; if(v==='auto'){ applyTheme(null); try{localStorage.removeItem('kw-theme');}catch(e){} } else { applyTheme(v); LS.set('kw-theme',v); } renderSettings(); };
  $('#segFs').onclick=ev=>{const b=ev.target.closest('button'); if(!b) return; LS.set('kw-fs',+b.dataset.v); applyFs(+b.dataset.v); renderSettings(); };
  $('#bkExport').onclick=exportData; $('#bkImport').onclick=()=>$('#bkFile').click();
  $('#bkFile').onchange=ev=>{const f=ev.target.files&&ev.target.files[0]; ev.target.value=''; if(f) importData(f);};
  $('#bkReset').onclick=()=>{ if(!confirm('ลบสถิติ ข้อที่บันทึก และการตั้งค่าทั้งหมดในเครื่องนี้?')) return; BKEYS.concat(['kw-ai-v1']).forEach(k=>{try{localStorage.removeItem(k);}catch(e){}}); toast('ล้างข้อมูลแล้ว กำลังโหลดใหม่'); setTimeout(()=>location.reload(),500); };
}
const BKEYS=['kw-marks-v1','kw-wrong-v1','kw-hist-v1','kw-subj-v1','kw-sr-v1','kw-stats-v1','kw-theme','kw-fs'];
function exportData(){
  const data={}; BKEYS.forEach(k=>{try{const v=localStorage.getItem(k); if(v!==null) data[k]=v;}catch(e){}});
  const blob=new Blob([JSON.stringify({app:'kw-civil',v:1,at:new Date().toISOString(),data})],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='kw-backup-'+todayStr()+'.json'; document.body.appendChild(a); a.click(); a.remove(); toast('ดาวน์โหลดไฟล์สำรองแล้ว');
}
function importData(file){
  file.text().then(t=>{ const j=JSON.parse(t); if(j.app!=='kw-civil'||!j.data) throw new Error('bad'); if(!confirm('การนำเข้าจะแทนที่ข้อมูลของแอปในเครื่องนี้ ต้องการดำเนินการต่อไหม?')) return; BKEYS.forEach(k=>{ if(k in j.data){ try{localStorage.setItem(k,j.data[k]);}catch(e){} } }); toast('นำเข้าแล้ว กำลังโหลดใหม่'); setTimeout(()=>location.reload(),600); }).catch(()=>toast('ไฟล์สำรองไม่ถูกต้อง'));
}
function showUpdate(){
  if($('#updbar')) return; const d=document.createElement('div'); d.className='updbar'; d.id='updbar'; d.setAttribute('role','status');
  d.innerHTML='<span>มีเวอร์ชันใหม่พร้อมใช้งาน</span><button type="button" id="updBtn">โหลดใหม่</button>'; document.body.appendChild(d); $('#updBtn').onclick=()=>location.reload();
}
init().then(async()=>{ await initCam(); initShell(); initExtras(); aiInit(); const b=$('#boot'); if(b) b.remove(); switchTab('home'); openShared(); });

</script>
