<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คลังเฉลยข้อสอบ กว. สาขาโยธา</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B4F9C">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&family=Noto+Serif+Thai:wght@400;600&display=swap">
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#16202A; --muted:#5A6774; --line:#D3DAE2;
  --accent:#1B4F9C; --accent-ink:#FFFFFF; --accent-soft:#E3ECF9;
  --ok:#0C7548; --ok-soft:#E1F3E9; --warn:#9A4F08; --warn-soft:#FBEBD6; --bad:#B3261E; --bad-soft:#FBE4E2;
  --hl:#FFE58A;
  --sans:'Noto Sans Thai','Sarabun','Tahoma','Thonburi',system-ui,sans-serif;
  --serif:'Noto Serif Thai','Thonburi','Tahoma',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1419; --surface:#171F27; --ink:#E5EAEF; --muted:#94A2B0; --line:#2A3540;
    --accent:#7FB0F5; --accent-ink:#0B1622; --accent-soft:#1B2A3D;
    --ok:#52C58E; --ok-soft:#12302A; --warn:#E3A55F; --warn-soft:#33261A; --bad:#F09088; --bad-soft:#3A1E1D;
    --hl:#6B5A10;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1419; --surface:#171F27; --ink:#E5EAEF; --muted:#94A2B0; --line:#2A3540;
  --accent:#7FB0F5; --accent-ink:#0B1622; --accent-soft:#1B2A3D;
  --ok:#52C58E; --ok-soft:#12302A; --warn:#E3A55F; --warn-soft:#33261A; --bad:#F09088; --bad-soft:#3A1E1D;
  --hl:#6B5A10;
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}

/* header + controls */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .wrap{padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-size:1.15rem;font-weight:700;letter-spacing:.01em}
.brand .sub{color:var(--muted);font-size:.85rem}
.tabs{display:flex;gap:4px;margin:10px 0 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;color:var(--muted);font-weight:500;white-space:nowrap;min-height:44px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.searchrow{display:flex;gap:8px;margin-top:10px}
.searchrow input[type=search]{flex:1;min-width:0;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--bg);font-size:1.05rem}
.searchrow input[type=search]:focus{border-color:var(--accent);outline:none}
.searchrow input.num{flex:0 0 96px;padding:12px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);text-align:center}
.searchrow input.num:focus{border-color:var(--accent);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88rem;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:8px;font-size:.88rem;color:var(--muted)}
.opts select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.opts label{display:inline-flex;align-items:center;gap:6px}

.searchrow button.cam{flex:0 0 50px;border:2px solid var(--line);background:var(--bg);border-radius:10px;font-size:1.3rem;line-height:1;min-height:48px}
.searchrow button.cam:hover{border-color:var(--accent)}
.imgpanel{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.imgpanel .head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.imgpanel h2{margin:0;font-size:1rem}
.imgpanel .thumb{max-width:100%;max-height:180px;border-radius:8px;border:1px solid var(--line);display:block;margin:8px 0}
.imgpanel textarea{width:100%;min-height:96px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--serif);font-size:.98rem;line-height:1.6;resize:vertical}
.imgpanel .sc{font-size:.82rem;color:var(--muted);margin:2px 0 6px}
.spin{display:inline-block;width:14px;height:14px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;vertical-align:-2px;margin-right:6px}
@media (prefers-reduced-motion: no-preference){.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
.brandr{display:flex;align-items:center;gap:8px}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:38px;height:38px;font-size:1.05rem;line-height:1}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts button{border:1px solid var(--line);background:none;border-radius:8px;padding:5px 10px;font-size:.82rem;color:var(--muted);min-height:34px}
.acts button:hover{border-color:var(--accent);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:20;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:90vw}
.dropveil{position:fixed;inset:0;background:rgba(27,79,156,.78);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700;z-index:30;text-align:center;padding:24px}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0}
.frm label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
.frm select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 8px;color:var(--ink);max-width:100%}
.frm label.chk{flex-direction:row;align-items:center;gap:8px}
.exbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;font-weight:700}
.exbar .clock{font-variant-numeric:tabular-nums;color:var(--accent)}
.exbar .clock.low{color:var(--bad)}
.prog{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--accent)}
button.opt.sel{background:var(--accent-soft);border-color:var(--accent)}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pal button{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:.85rem}
.pal button.done{background:var(--accent-soft);border-color:var(--accent)}
.pal button.cur{outline:3px solid var(--accent)}
.big{font-size:2.2rem;font-weight:700;line-height:1.1}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.hero{display:grid;gap:8px;margin-bottom:12px}
.progbar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0}
.progbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
main{padding:16px 0 64px}
.count{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.panel[hidden]{display:none}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.meta{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;font-size:.82rem;color:var(--muted)}
.meta .srcs{display:flex;flex-direction:column;gap:2px;min-width:0}
.meta .src b{color:var(--ink);font-weight:700}
.meta details summary{cursor:pointer;color:var(--accent);list-style:none}
.meta details summary::-webkit-details-marker{display:none}
.star{flex:0 0 auto;background:none;border:1px solid var(--line);border-radius:8px;width:40px;height:40px;font-size:1.15rem;line-height:1;color:var(--muted)}
.star[aria-pressed="true"]{color:#C58A00;border-color:#C58A00;background:var(--warn-soft)}
.stem{font-family:var(--serif);font-size:1.05rem;line-height:1.75;margin:10px 0;white-space:pre-line;overflow-wrap:anywhere}
.choices{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.choice{display:flex;gap:10px;padding:8px 10px;border-radius:8px;border:1px solid transparent;overflow-wrap:anywhere}
.choice .no{flex:0 0 1.6em;font-weight:700;color:var(--muted);text-align:right}
.choice .tx{font-family:var(--serif);white-space:pre-line;min-width:0}
.choice.empty .tx{color:var(--muted);font-family:var(--sans);font-size:.9rem}
.choice.correct{background:var(--ok-soft);border-color:var(--ok)}
.choice.correct .no{color:var(--ok)}
.choice.correct .tx{text-decoration:underline;text-decoration-thickness:2.5px;text-underline-offset:5px;text-decoration-color:var(--ok);font-weight:600}
.choice .mark{margin-left:auto;flex:0 0 auto;color:var(--ok);font-size:.82rem;font-weight:700;white-space:nowrap;padding-left:8px}
.notes{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:.85rem}
.note{padding:6px 10px;border-radius:8px;background:var(--accent-soft);color:var(--ink)}
.note.warn{background:var(--warn-soft)}
.note.quiet{background:none;padding:0;color:var(--muted)}
details.orig{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
details.orig summary{cursor:pointer;color:var(--accent);font-size:.9rem;font-weight:500}
details.orig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:6px;border:1px solid var(--line)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.more{display:block;width:100%;padding:12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:500}

/* welcome / empty */
.empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px}
.empty-state h2{margin:0 0 8px;font-size:1.05rem}
.empty-state p{margin:6px 0;color:var(--muted)}
.empty-state ul{margin:8px 0 12px;padding-left:1.2em;color:var(--muted)}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ex button{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:8px;padding:6px 10px;font-size:.9rem}

/* practice */
.pbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;color:var(--muted);font-size:.9rem}
button.opt{display:flex;width:100%;text-align:left;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
button.opt .no{flex:0 0 1.6em;text-align:right;font-weight:700;color:var(--muted)}
button.opt .tx{font-family:var(--serif);white-space:pre-line;min-width:0;overflow-wrap:anywhere}
button.opt.right{background:var(--ok-soft);border-color:var(--ok)}
button.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
button.opt[disabled]{cursor:default}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 18px;font-weight:700;min-height:44px}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
th{color:var(--muted);font-weight:500}
td.r,th.r{text-align:right}
.tblwrap{overflow-x:auto}
.about h2{font-size:1rem;margin:20px 0 6px}
.about p,.about li{color:var(--ink)}
.about li{margin:4px 0}
@media (prefers-reduced-motion: no-preference){.card{transition:border-color .15s}}
@media (max-width:480px){.searchrow input.num{flex-basis:70px}.searchrow button.cam{flex-basis:46px}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>คลังเฉลยข้อสอบ กว. สาขาโยธา</h1>
      <span class="brandr"><span class="sub" id="stat">กำลังโหลด…</span><button class="iconbtn" id="themeBtn" type="button" aria-label="สลับโหมดสว่างและมืด" title="สลับโหมดสว่าง/มืด">🌓</button></span>
    </div>
    <div class="tabs" role="tablist" aria-label="เมนู">
      <button class="tab" role="tab" id="t-search" aria-selected="true" data-tab="search">ค้นหา</button>
      <button class="tab" role="tab" id="t-practice" aria-selected="false" data-tab="practice">ฝึกทำ</button>
      <button class="tab" role="tab" id="t-exam" aria-selected="false" data-tab="exam">โหมดสอบ</button>
      <button class="tab" role="tab" id="t-marks" aria-selected="false" data-tab="marks">บันทึกไว้ <span id="markCount"></span></button>
      <button class="tab" role="tab" id="t-about" aria-selected="false" data-tab="about">เกี่ยวกับข้อมูล</button>
    </div>
    <div id="filters" hidden>
      <div class="searchrow" id="searchRow">
        <input type="search" id="q" placeholder="พิมพ์คำจากโจทย์หรือตัวเลือก" autocomplete="off" aria-label="คำค้น">
        <input class="num" type="number" inputmode="numeric" min="1" id="num" placeholder="เลขข้อ" aria-label="เลขข้อ">
        <button class="cam" id="camBtn" type="button" hidden aria-label="ค้นหาจากรูปโจทย์" title="ถ่ายรูป เลือกรูป หรือวางรูปโจทย์ (Ctrl+V) เพื่อหาข้อที่ตรงกัน">📷</button>
        <input type="file" id="camFile" accept="image/*" hidden>
      </div>
      <div class="chips" id="chips" role="group" aria-label="กรองตามไฟล์"></div>
      <div class="opts" id="subjRow"><label>วิชา <select id="subj" aria-label="กรองตามวิชา" style="max-width:100%"><option value="">ทุกวิชา</option></select></label></div>
      <div class="opts" id="searchOpts">
        <label>แสดง
          <select id="status">
            <option value="all">ทุกรายการ</option>
            <option value="ans">เฉพาะที่มีเฉลย</option>
            <option value="conf">เฉพาะเฉลยที่ยืนยันแล้ว</option>
            <option value="calc">เฉพาะที่ Claude คำนวณเฉลย</option>
            <option value="noans">เฉพาะที่ไม่มีเฉลย</option>
          </select>
        </label>
      </div>
      <div class="opts" id="practiceOpts" hidden>
        <label><input type="checkbox" id="skipFig" checked> ข้ามข้อที่ต้องดูรูป</label>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="panel" id="p-search">
    <div id="imgPanel"></div>
    <div id="results"></div>
  </section>
  <section class="panel" id="p-practice" hidden></section>
  <section class="panel" id="p-exam" hidden></section>
  <section class="panel" id="p-marks" hidden></section>
  <section class="panel about" id="p-about" hidden></section>
</main>

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalize(s){return s.toLowerCase().replace(/[\u0E47-\u0E4C]/g,'').replace(/[^\p{L}\p{N}\p{Mn}]+/gu,'');}
const fileName=i=>'กว_'+FILES[i];
function srcLabel(s){
  const [f,set,n,p,pe]=s; const pg=pe&&pe!==p?`${p}–${pe}`:p;
  if(f===0) return `<span class="src"><b>${fileName(f)}</b> (ไฟล์สแกน)${SETS['0:'+set]?' · '+esc(SETS['0:'+set]):''}${n?' · ข้อ '+n:''} · หน้า ${pg}</span>`;
  return `<span class="src"><b>${fileName(f)}</b> · ${esc(SETS[f+':'+set]||('ชุด '+set))} · ข้อ ${n} · หน้า ${pg}</span>`;
}
function hlRegex(terms){
  if(!terms.length) return null;
  const gap='[\\u0E47-\\u0E4C\\s\\p{P}\\p{S}]*';
  const parts=[...terms].sort((a,b)=>b.length-a.length).map(t=>Array.from(t).map(c=>c.replace(/[.*+?^${}()|[\]\\\/-]/g,'\\$&')).join(gap));
  try{return new RegExp(parts.join('|'),'giu');}catch(e){return null;}
}
function hl(text,re){
  if(!re) return esc(text);
  let out='',last=0,m; re.lastIndex=0;
  while((m=re.exec(text))){
    if(m[0]==='') {re.lastIndex++; continue;}
    out+=esc(text.slice(last,m.index))+'<mark>'+esc(m[0])+'</mark>'; last=m.index+m[0].length;
  }
  return out+esc(text.slice(last));
}

/* ---------- data ---------- */
function loadScript(u){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s);});}
async function inflate(b64){
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  if('DecompressionStream' in window){
    const ds=new DecompressionStream('deflate-raw');
    return await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
  }
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js');
  return new TextDecoder().decode(pako.inflateRaw(bin));
}
async function init(){
  try{
    const data=JSON.parse(await inflate(B64));
    FILES=data.files; SETS=data.sets||{};
    E=data.e.map((r,i)=>{
      const o={i,q:r[0],c:r[1],a:r[2],h:r[3],g:r[4],t:r[5],o:r[6],s:r[7],x:r[8]||'',cf:r[9]||'',tr:r[10]||0,im:r[11]||[]};
      o.nq=normalize(o.q); o.all=o.nq+'\u0001'+normalize(o.c.join(' ')); o.id=hid(o);
      o.fm=new Set(o.s.map(x=>x[0])); o.ns=new Set(o.s.map(x=>x[2])); o.sn=new Set(o.s.map(x=>SETS[x[0]+':'+x[1]]).filter(Boolean));
      return o;
    });
  }catch(err){
    $('#stat').textContent='โหลดข้อมูลไม่สำเร็จ';
    $('#results').innerHTML='<div class="empty-state"><h2>เปิดฐานข้อมูลไม่ได้</h2><p>เบราว์เซอร์นี้อาจไม่รองรับการแตกไฟล์ข้อมูล ลองเปิดด้วย Chrome, Safari หรือ Firefox เวอร์ชันล่าสุด แล้วรีเฟรชหน้า</p></div>';
    console.error(err); return;
  }
  try{MARKS=new Set(JSON.parse(localStorage.getItem('kw-marks-v1')||'[]').filter(i=>E[i]));}catch(e){MARKS=new Set();}
  HMAP=new Map(E.map(e=>[e.id,e])); WRONG=new Set(LS.get('kw-wrong-v1',[]).filter(id=>HMAP.has(id)));
  const ans=E.filter(e=>e.a&&['p','u','s2'].includes(e.h)).length;
  const calc=E.filter(e=>e.h==='c').length;
  $('#stat').textContent=`${E.length.toLocaleString('th-TH')} ข้อ · เฉลยยืนยันแล้ว ${ans.toLocaleString('th-TH')}`+(calc?` · Claude คำนวณ ${calc.toLocaleString('th-TH')}`:'');
  buildChips(); buildSubj(); renderAbout(); updateMarkCount(); $('#filters').hidden=false; run();
}
function saveMarks(){try{localStorage.setItem('kw-marks-v1',JSON.stringify([...MARKS]));}catch(e){} updateMarkCount();}
function updateMarkCount(){$('#markCount').textContent=MARKS.size?`(${MARKS.size})`:'';}

/* ---------- filters ---------- */
function buildChips(){
  const box=$('#chips'); let h=`<button class="chip" id="chipAll" aria-pressed="true">ทุกไฟล์</button>`;
  FILES.forEach((f,i)=>{h+=`<button class="chip" data-f="${i}" aria-pressed="false">${fileName(i)}${i===0?' (สแกน)':''}</button>`;});
  box.innerHTML=h;
  box.addEventListener('click',ev=>{
    const b=ev.target.closest('.chip'); if(!b) return;
    if(b.id==='chipAll') FSEL.clear(); else {const f=+b.dataset.f; FSEL.has(f)?FSEL.delete(f):FSEL.add(f);}
    syncChips(); tab==='practice'?nextPractice():run();
  });
}
function syncChips(){
  $('#chipAll').setAttribute('aria-pressed',FSEL.size===0);
  document.querySelectorAll('.chip[data-f]').forEach(b=>b.setAttribute('aria-pressed',FSEL.has(+b.dataset.f)));
}
const inFiles=e=>FSEL.size===0||[...e.fm].some(f=>FSEL.has(f));
const inSubj=e=>!SUBJ||e.sn.has(SUBJ);
function buildSubj(){
  const names=[...new Set(Object.values(SETS))].sort((a,b)=>a.localeCompare(b));
  const sel=$('#subj'); sel.innerHTML='<option value="">ทุกวิชา</option>'+names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
  sel.addEventListener('change',()=>{SUBJ=sel.value; tab==='practice'?nextPractice():run();});
}

/* ---------- search ---------- */
let timer=null;
$('#q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(run,140);});
$('#num').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(run,140);});
$('#status').addEventListener('change',run);

function run(){
  const raw=$('#q').value.trim();
  const terms=raw.split(/\s+/).map(normalize).filter(Boolean);
  const num=parseInt($('#num').value,10)||null;
  const st=$('#status').value;
  const box=$('#results');
  if(!terms.length&&!num&&FSEL.size===0&&st==='all'&&!SUBJ){ current=[]; box.innerHTML=welcome(); return; }
  const phrase=terms.join('');
  const out=[];
  for(const e of E){
    if(!inFiles(e)||!inSubj(e)) continue;
    if(num&&![...e.s].some(x=>x[2]===num&&(FSEL.size===0||FSEL.has(x[0])))) continue;
    if(st==='ans'&&!e.a) continue;
    if(st==='conf'&&!(e.a&&['p','u','s2'].includes(e.h))) continue;
    if(st==='calc'&&e.h!=='c') continue;
    if(st==='noans'&&e.a) continue;
    let sc=0;
    if(terms.length){
      if(!terms.every(t=>e.all.includes(t))) continue;
      if(e.nq.includes(phrase)) sc=4; else if(terms.every(t=>e.nq.includes(t))) sc=2; else sc=1;
    }
    if(e.o) sc-=10;
    out.push([sc,e]);
  }
  out.sort((a,b)=>b[0]-a[0]);
  current=out.map(x=>x[1]); shown=0;
  box.dataset.re=''; window.__re=hlRegex(terms);
  box.innerHTML=`<p class="count">พบ ${current.length.toLocaleString('th-TH')} รายการ</p><div id="list"></div><div id="moreBox"></div>`;
  if(!current.length){ $('#list').innerHTML=`<div class="empty-state"><h2>ไม่พบรายการที่ตรงกัน</h2><p>ลองพิมพ์คำให้สั้นลง หรือค้นด้วยคำเดียว เช่น ชื่อหัวข้อหรือค่าตัวเลขในโจทย์ ถ้าเลือกไฟล์ไว้ ให้กด "ทุกไฟล์" เพื่อค้นทั้งหมด</p></div>`; return; }
  more();
}
function more(){
  const list=$('#list'); const slice=current.slice(shown,shown+PAGE);
  list.insertAdjacentHTML('beforeend',slice.map(e=>card(e,window.__re)).join(''));
  shown+=slice.length;
  $('#moreBox').innerHTML=shown<current.length?`<button class="more" id="moreBtn">แสดงเพิ่ม (เหลืออีก ${(current.length-shown).toLocaleString('th-TH')})</button>`:'';
  const b=$('#moreBtn'); if(b) b.onclick=more;
}
function welcome(){
  return `<div class="empty-state"><h2>ค้นหาเฉลยจากโจทย์</h2>
  <p>พิมพ์คำใดก็ได้ที่อยู่ในโจทย์หรือตัวเลือก ระบบค้นโดยไม่สนไม้เอก ไม้โท หรือช่องว่าง</p>
  <ul><li>พิมพ์หลายคำ = ข้อนั้นต้องมีครบทุกคำ</li><li>ใส่ "เลขข้อ" เพื่อดูข้อตามลำดับในไฟล์ที่เลือก</li><li>กดชื่อไฟล์เพื่อจำกัดการค้นหา</li><li>มีรูปโจทย์? กด 📷 หรือวางรูป (Ctrl+V) เพื่อหาข้อที่ตรงกัน</li></ul>
  <p>ลองค้น</p><div class="ex">

/* ---------- card ---------- */
function card(e,re){
  const srcs=e.s.slice(0,2).map(srcLabel).join('');
  const rest=e.s.length>2?`<details><summary>อีก ${e.s.length-2} ที่มา</summary>${e.s.slice(2).map(srcLabel).join('')}</details>`:'';
  const pg=e.s[0][3];
  const fname=fileName(e.s[0][0]);
  let body='',notes='';
  const stem=e.q||'(โจทย์เป็นรูปภาพ ดูที่ต้นฉบับ)';
  const pgs=e.s.find(x=>x[0]===0)||e.s[0];
  const nnote=e.h==='n'?`<div class="note warn"><b>ต้นฉบับไม่มีเฉลย และ Claude ตรวจแล้วไม่พบตัวเลือกที่ถูกต้อง</b><br>${esc(e.x||'')}</div>`:'';
  const wnote=e.h==='w'?`<div class="note warn"><b>ต้นฉบับมีเฉพาะโจทย์และวิธีทำด้วยลายมือ</b> ไม่มีตัวเลือกและเลขเฉลยที่พิมพ์ไว้ ดูวิธีทำและคำตอบที่ ${fileName(0)} หน้า ${pgs[3]}</div>`:'';
  const cnote=e.h==='c'?`<div class="note warn"><b>เฉลยนี้ Claude คำนวณเอง</b> ต้นฉบับไม่มีเฉลยข้อนี้ ความมั่นใจ: ${esc(e.cf||'-')}${e.x?'<br>'+esc(e.x):''}</div>`:'';
  body=`<div class="stem">${hl(stem,re)}</div>`+(e.h==='w'?'':`<ol class="choices">`+e.c.map((c,k)=>{
    const ok=e.a===k+1;
    const txt=c?hl(c,re):'(ตัวเลือกเป็นรูปภาพหรืออ่านไม่ได้)';
    const mk=ok?(e.h==='c'?'✓ เฉลย (Claude คำนวณ)':e.h==='s1'?'✓ เฉลย (ยืนยันไม่ครบ)':'✓ เฉลย'):'';
    return `<li class="choice${ok?' correct':''}${c?'':' empty'}"><span class="no">${k+1}</span><span class="tx">${txt}</span>${mk?`<span class="mark">${mk}</span>`:''}</li>`;
  }).join('')+'</ol>');
  if(e.o){
    notes+=e.tr?`<div class="note quiet">ข้อความถอดจากภาพสแกนโดย Claude ตรวจเทียบภาพแล้ว (${fileName(0)} หน้า ${pgs[3]})</div>`:`<div class="note warn">ข้อนี้อ่านจากไฟล์สแกนด้วย OCR ข้อความอาจผิดเพี้ยน ตรวจกับ ${fileName(0)} หน้า ${pgs[3]}</div>`;
    if(e.h==='w') notes+=wnote;
    else if(e.h==='c') notes+=cnote;
    else if(e.h==='s2'&&e.tr) notes+=`<div class="note quiet">เฉลยตรวจเทียบภาพสแกนแล้ว (เลขที่พิมพ์และแถบไฮไลต์ตรงกัน)</div>`;
    else if(e.h==='s2') notes+=`<div class="note quiet">เฉลยอ่านจากภาพสแกนสองแหล่งที่ตรงกัน (เลขที่พิมพ์และแถบไฮไลต์) เทียบกับข้อที่ยืนยันแล้ว ถูกราว 94–97%</div>`;
    else if(e.h==='s1') notes+=`<div class="note warn">เฉลยอ่านจากภาพสแกนได้แหล่งเดียว ถูกราว 92% ควรตรวจซ้ำที่ต้นฉบับ</div>`;
    else notes+=`<div class="note warn">ยังยืนยันเฉลยข้อนี้ไม่ได้${e.x?' ('+esc(e.x)+')':''} ดูที่ต้นฉบับ</div>`;
  }else{
    if(!e.a) notes+=e.h==='n'?nnote:`<div class="note warn">ต้นฉบับไม่ได้ระบุเฉลยข้อนี้</div>`;
    if(e.g===2) notes+=`<div class="note">โจทย์หรือตัวเลือกบางส่วนเป็นรูป ดูรูปที่ ${fname} หน้า ${pg}</div>`;
    else if(e.g===1) notes+=`<div class="note">โจทย์อ้างถึงรูปหรือตาราง ดูที่ ${fname} หน้า ${pg}</div>`;
    if(e.t) notes+=`<div class="note warn">ต้นฉบับอาจถูกตัดที่หน้าสุดท้าย ข้อความอาจไม่ครบ</div>`;
    if(e.a&&e.h==='c') notes+=cnote;
    else if(e.a) notes+=`<div class="note quiet">${e.h==='u'?'เฉลยอ่านจากเส้นใต้ตัวเลือกในต้นฉบับ':'เฉลยตามที่พิมพ์ไว้ในต้นฉบับ'}</div>`;
  }
  const acts='<div class="acts"><button type="button" data-act="copy" data-i="'+e.i+'">📋 คัดลอกข้อความ</button>'+(/^https?:/.test(location.protocol)?'<button type="button" data-act="link" data-i="'+e.i+'">🔗 คัดลอกลิงก์</button>':'')+'</div>';
  let orig='';
  if(IMG_BASE&&e.im&&e.im.length){
    orig='<div class="origs">'+e.im.map(n=>{
      const m=/^t_(\d+)_(\d+)$/.exec(n), s=/^s_(\d+)_(\d+)$/.exec(n);
      const lab=m?`${fileName(+m[1])} หน้า ${m[2]}`:s?`${fileName(0)} หน้า ${s[1]} (ภาพตัดเฉพาะข้อนี้)`:n;
      return `<details class="orig"><summary>🖼 ดูรูปต้นฉบับ: ${esc(lab)}</summary><a href="${IMG_BASE}${n}.webp" target="_blank" rel="noopener"><img loading="lazy" alt="รูปต้นฉบับ ${esc(lab)}" src="${IMG_BASE}${n}.webp"></a></details>`;
    }).join('')+'</div>';
  }
  return `<article class="card"><div class="meta"><div class="srcs">${srcs}${rest}</div>
  <button class="star" data-i="${e.i}" aria-pressed="${MARKS.has(e.i)}" aria-label="บันทึกข้อนี้" title="บันทึกไว้ทบทวน">★</button></div>
  ${body}${notes?`<div class="notes">${notes}</div>`:''}${orig}${acts}</article>`;
}

let pcur=null, pscore={ok:0,n:0};
function pool(){return E.filter(e=>!e.o&&e.a&&e.h!=='c'&&e.q&&e.c.every(Boolean)&&inFiles(e)&&inSubj(e)&&(!$('#skipFig').checked||e.g===0));}
function nextPractice(){
  const P=pool(), box=$('#p-practice');
  if(!P.length){box.innerHTML='<div class="empty-state"><h2>ไม่มีข้อให้ฝึก</h2><p>ลองเลือกไฟล์อื่น หรือปิดตัวเลือก "ข้ามข้อที่ต้องดูรูป"</p></div>'; return;}
  pcur=P[Math.floor(Math.random()*P.length)];
  const e=pcur;
  box.innerHTML=`<div class="pbar"><span>ข้อที่ให้ฝึกได้ ${P.length.toLocaleString('th-TH')} ข้อ</span><span>ตอบถูก ${pscore.ok} จาก ${pscore.n}</span></div>
  <article class="card"><div class="stem" style="margin-top:0">${esc(e.q)}</div>
  <div class="choices" id="popts">${e.c.map((c,k)=>`<button class="opt" data-k="${k+1}"><span class="no">${k+1}</span><span class="tx">${esc(c)}</span></button>`).join('')}</div>
  <div id="pfb"></div></article>`;
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button.opt'); if(!b||!pcur) return;
  const k=+b.dataset.k, e=pcur;
  document.querySelectorAll('#popts .opt').forEach(x=>{x.disabled=true; const kk=+x.dataset.k; if(kk===e.a) x.classList.add('right'); else if(kk===k) x.classList.add('wrong');});
  pscore.n++; if(k===e.a) pscore.ok++;
  $('#pfb').innerHTML=`<div class="notes"><div class="note ${k===e.a?'':'warn'}">${k===e.a?'ถูกต้อง':'ยังไม่ถูก เฉลยคือข้อ '+e.a}</div><div class="note quiet">${e.s.slice(0,2).map(srcLabel).join(' ')}</div></div>
  <div class="row"><button class="primary" id="pnext">ข้อต่อไป</button><button class="ghost star" data-i="${e.i}" aria-pressed="${MARKS.has(e.i)}" style="width:auto;padding:0 14px">★ บันทึกไว้</button></div>`;
  $('#pnext').onclick=nextPractice; $('#pnext').focus();
});
$('#skipFig').addEventListener('change',nextPractice);

const PROMPT='ภาพนี้คือโจทย์ข้อสอบวิศวกรรม (ไทย/อังกฤษ) ที่ผู้ใช้ถ่ายหรือแคปหน้าจอ งานของคุณคือ "ถอดข้อความ" เท่านั้น: คัดลอกข้อความของโจทย์และของตัวเลือกให้ตรงตามที่เห็นทุกตัวอักษร (รวมตัวเลข หน่วย สัญลักษณ์ และชื่อภาษาอังกฤษ) ห้ามแก้คำ ห้ามสรุป ห้ามแก้โจทย์ ห้ามคำนวณ และห้ามบอกว่าคำตอบคืออะไร ถ้าเห็นหลายข้อให้แยกเป็นหลายรายการ (ไม่เกิน 3 ข้อ) ถ้าตัวเลือกใดเป็นรูปภาพให้ใส่สตริงว่างในตำแหน่งนั้น ตอบเป็น JSON เท่านั้นตามรูปแบบนี้: {"items":[{"question":"...","choices":["...","...","...","..."],"hasFigure":false}]} ถ้าไม่พบข้อความโจทย์ในรูปให้ตอบ {"items":[]}';

    SAMPLE=s; const mt=(caps.images.mediaTypes||[]).join(','); if(mt) $('#camFile').accept=mt;
    $('#camBtn').hidden=false;

function buildInv(){
  INV=new Map();
  E.forEach((e,id)=>{
    const s=e.all.replace('\u0001',''); const seen=new Set();
    for(let i=0;i<s.length-2;i++){const g=s.substr(i,3); if(seen.has(g)) continue; seen.add(g); let a=INV.get(g); if(!a){a=[];INV.set(g,a);} a.push(id);}
    e.tn=seen.size||1;
  });
}
function matchText(text){
  if(!INV) buildInv();
  const n=normalize(text); if(n.length<8) return [];
  const qs=new Set(); for(let i=0;i<n.length-2;i++) qs.add(n.substr(i,3));
  const hit=new Map();
  for(const g of qs){const a=INV.get(g); if(a) for(const id of a) hit.set(id,(hit.get(id)||0)+1);}
  const out=[];
  for(const [id,c] of hit){const e=E[id]; const s1=c/qs.size, s2=c/e.tn; if(s1>=0.28) out.push([0.75*s1+0.25*s2,s1,e]);}
  out.sort((a,b)=>b[0]-a[0]); return out.slice(0,6);
}

async function readImageClaude(file){
  if(!SAMPLE) return;
  const panel=$('#imgPanel'); const url=URL.createObjectURL(file);
  camCtl=new AbortController(); const ctl=camCtl;
  panel.innerHTML=`<div class="imgpanel"><div class="head"><h2><span class="spin"></span>กำลังอ่านรูปโจทย์…</h2><button class="ghost" id="camStop" type="button">หยุด</button></div>
  <img class="thumb" alt="รูปโจทย์ที่เลือก" src="${url}">
  <p class="count">ใช้โควตา Claude ของคุณ ครั้งแรกอาจมีหน้าต่างขอสิทธิ์ และอาจใช้เวลาถึงประมาณ 1 นาที</p></div>`;
  $('#camStop').onclick=()=>ctl.abort();
  try{
    const data=await SAMPLE.json(PROMPT,{images:file,signal:ctl.signal});

    if(e&&e.code==='cancelled'){panel.innerHTML='';return;}

    panel.querySelector('.count').textContent=camMsg(e&&e.code);
    $('#camClose').onclick=closePanel;
  }
}
function itemText(it){return [it.question||'',...(Array.isArray(it.choices)?it.choices:[])].join(' ').trim();}
function renderPhoto(items,url,engine){

  panel.innerHTML=`<div class="imgpanel"><div class="head"><h2>ผลจากรูปโจทย์</h2><button class="ghost" id="camClose" type="button">ปิด</button></div>

  if(engine==='local'){
    const nt=document.createElement('p'); nt.className='count'; nt.textContent='อ่านด้วยตัวอ่านข้อความในเบราว์เซอร์ของคุณ (ไม่มีการอัปโหลดรูป) อาจมีตัวอักษรเพี้ยน แก้ข้อความด้านล่างได้'; body.appendChild(nt);
    if(SAMPLE&&LASTFILE){ const b=document.createElement('button'); b.className='ghost'; b.type='button'; b.textContent='ให้ Claude อ่านรูปซ้ำ (แม่นกว่า)'; b.onclick=()=>readImageClaude(LASTFILE); nt.after(b); }
  }

  items.slice(0,3).forEach((it,idx)=>{
    const sec=document.createElement('div'); sec.style.marginTop=idx?'16px':'0';
    sec.innerHTML=`<p class="sc">${items.length>1?`ข้อที่ ${idx+1} ในรูป · `:''}ข้อความที่อ่านได้ (แก้ไขได้ถ้าอ่านผิด)</p><textarea aria-label="ข้อความที่อ่านจากรูป"></textarea>
    <div class="row" style="margin-top:8px"><button class="primary" type="button" data-rematch>ค้นหาใหม่จากข้อความนี้</button></div><div data-res style="margin-top:12px"></div>`;
    body.appendChild(sec);
    const ta=sec.querySelector('textarea'); ta.value=itemText(it);
    const doMatch=()=>{
      const m=matchText(ta.value), box=sec.querySelector('[data-res]');
      if(!m.length){box.innerHTML='<div class="note warn">ไม่พบข้อที่ตรงกันในฐานข้อมูล ลองแก้ข้อความด้านบนแล้วค้นใหม่ หรือพิมพ์คำสำคัญในช่องค้นหา</div>'; return;}
      const close=m.length>1&&(m[0][1]-m[1][1])<0.08;
      let h='';
      if(close||m.some(x=>x[2].g>0)) h+='<div class="note warn" style="margin-bottom:8px">ถ้าโจทย์มีรูป ข้อความเหมือนกันอาจมีหลายข้อ โปรดเทียบรูปกับหน้าต้นฉบับที่ระบุในแต่ละการ์ด</div>';
      h+=m.map(([sc,s1,e])=>`<p class="sc">ความตรงกับข้อความที่อ่านได้ ${Math.round(s1*100)}%</p>`+card(e,null)).join('');
      box.innerHTML=h;
    };
    sec.querySelector('[data-rematch]').onclick=doMatch; doMatch();
  });
}

function hid(e){
  let h=2166136261; const s=e.nq+'|'+normalize(e.c.join('|'))+'|'+e.s[0].slice(0,4).join('.');
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return (h>>>0).toString(36);
}
function plainText(e){
  const L=[e.q||'(โจทย์เป็นรูปภาพ)'];
  e.c.forEach((c,k)=>{ if(c) L.push((k+1)+') '+c); });
  if(e.a) L.push('เฉลย: ข้อ '+e.a+(e.h==='c'?' (Claude คำนวณ ไม่ใช่เฉลยต้นฉบับ)':''));
  const s=e.s[0]; L.push('— '+fileName(s[0])+(SETS[s[0]+':'+s[1]]?' · '+SETS[s[0]+':'+s[1]]:'')+' · หน้า '+s[3]);
  return L.join('\n');
}

/* ---------- local OCR (runs in the browser, nothing is uploaded) ---------- */
const absURL=p=>new URL(p,location.href).href;
function ocrStatusTh(m){
  const s=m&&m.status||''; const pc=Math.round(((m&&m.progress)||0)*100);
  if(/core/.test(s)) return 'กำลังโหลดตัวอ่านข้อความ…';
  if(/language|traineddata/.test(s)) return 'กำลังโหลดข้อมูลภาษาไทย/อังกฤษ (ครั้งแรกเท่านั้น)…'+(pc?' '+pc+'%':'');
  if(/initializ/.test(s)) return 'กำลังเตรียมตัวอ่าน…';
  if(/recogniz/.test(s)) return 'กำลังอ่านข้อความจากรูป… '+pc+'%';
  return 'กำลังทำงาน…';
}
async function getOcr(onStatus){
  if(ocrWorker) return ocrWorker;
  if(!ocrLoading){
    ocrLoading=(async()=>{
      await loadScript(absURL(OCR_BASE+'tesseract/tesseract.min.js'));
      const w=await Tesseract.createWorker(['tha','eng'],1,{
        workerPath:absURL(OCR_BASE+'tesseract/worker.min.js'),
        corePath:absURL(OCR_BASE+'tesseract'),
        langPath:absURL(OCR_BASE+'tessdata'),
        logger:m=>{ if(window.__ocrStatus) window.__ocrStatus(m); }
      });
      ocrWorker=w; return w;
    })().catch(err=>{ocrLoading=null;throw err;});
  }
  window.__ocrStatus=onStatus; return ocrLoading;
}
function fileToImage(file){
  return new Promise((ok,no)=>{ const u=URL.createObjectURL(file); const im=new Image(); const tm=setTimeout(()=>no(new Error('timeout')),10000); im.onload=()=>{clearTimeout(tm);ok(im);}; im.onerror=()=>{clearTimeout(tm);no(new Error('image'));}; im.src=u; });
}
async function prepImage(file){
  try{
    const im=await fileToImage(file); let w=im.naturalWidth,h=im.naturalHeight; if(!w||!h) return file;
    const long=Math.max(w,h), short=Math.min(w,h); let sc=1;
    if(long>2200) sc=2200/long; else if(short<700) sc=Math.min(2,900/short);
    const cv=document.createElement('canvas'); cv.width=Math.round(w*sc); cv.height=Math.round(h*sc);
    const cx=cv.getContext('2d'); if(!cx) return file;
    cx.drawImage(im,0,0,cv.width,cv.height);
    const d=cx.getImageData(0,0,cv.width,cv.height), px=d.data; const hist=new Uint32Array(256);
    for(let i=0;i<px.length;i+=4){ const g=(px[i]*0.299+px[i+1]*0.587+px[i+2]*0.114)|0; px[i]=px[i+1]=px[i+2]=g; hist[g]++; }
    const total=cv.width*cv.height; let lo=0,hi=255,acc=0;
    for(let i=0;i<256;i++){acc+=hist[i]; if(acc>total*0.01){lo=i;break;}} acc=0;
    for(let i=255;i>=0;i--){acc+=hist[i]; if(acc>total*0.01){hi=i;break;}}
    if(hi-lo>40){ const k=255/(hi-lo); for(let i=0;i<px.length;i+=4){ const v=Math.max(0,Math.min(255,((px[i]-lo)*k)|0)); px[i]=px[i+1]=px[i+2]=v; } }
    cx.putImageData(d,0,0); return cv;
  }catch(e){ return file; }
}
function ocrPanelBusy(url,msg,pct){
  $('#imgPanel').innerHTML='<div class="imgpanel"><div class="head"><h2><span class="spin"></span>กำลังค้นหาจากรูป…</h2><button class="ghost" id="camStop" type="button">ยกเลิก</button></div><img class="thumb" alt="รูปโจทย์ที่เลือก" src="'+url+'"><p class="count" id="ocrMsg"></p><div class="progbar"><i id="ocrBar"></i></div></div>';
  $('#ocrMsg').textContent=msg||''; $('#ocrBar').style.width=(pct||0)+'%';
}
async function readImageLocal(file){
  const url=URL.createObjectURL(file); let cancelled=false; ocrPanelBusy(url,'กำลังเริ่ม…',2);
  $('#camStop').onclick=()=>{cancelled=true; OCRBUSY=false; $('#imgPanel').innerHTML='';};
  try{
    const w=await getOcr(m=>{ if(cancelled) return; const el=$('#ocrMsg'); if(el){ el.textContent=ocrStatusTh(m); const b=$('#ocrBar'); if(b&&/recogniz/.test(m.status||'')) b.style.width=Math.max(10,Math.round((m.progress||0)*100))+'%'; else if(b&&/language|traineddata/.test(m.status||'')) b.style.width=Math.max(4,Math.round((m.progress||0)*60))+'%'; } });
    if(cancelled) return;
    const src=await prepImage(file);
    const res=await w.recognize(src);
    if(cancelled) return;
    const text=((res&&res.data&&res.data.text)||'').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').trim();
    renderPhoto(text?[{question:text,choices:[]}]:[],url,'local');
  }catch(err){
    if(cancelled) return;
    console.error(err);
    $('#imgPanel').innerHTML='<div class="imgpanel"><div class="head"><h2>อ่านรูปไม่สำเร็จ</h2><button class="ghost" id="camClose" type="button">ปิด</button></div><p class="count">โหลดตัวอ่านข้อความไม่สำเร็จ (ต้องเปิดผ่านลิงก์เว็บ ไม่ใช่เปิดไฟล์ในเครื่อง และเบราว์เซอร์ต้องรองรับ WebAssembly) ลองรีเฟรชหน้าแล้วลองใหม่ หรือพิมพ์คำสำคัญในช่องค้นหาแทน</p></div>';
    $('#camClose').onclick=closePanel;
  }finally{ OCRBUSY=false; }
}
async function readImage(file){
  if(!file||OCRBUSY) return; if(!/^image\//.test(file.type||'image/')) {toast('ไฟล์นี้ไม่ใช่รูปภาพ');return;}
  LASTFILE=file; switchTab('search');
  if(OCR_BASE){ OCRBUSY=true; return readImageLocal(file); }
  if(SAMPLE) return readImageClaude(file);
  toast('หน้านี้ยังอ่านรูปไม่ได้');
}

/* ---------- exam mode ---------- */
let EX=null, exTimer=null;
const examOK=e=>e.a&&['p','u','s2'].includes(e.h)&&(!e.o||e.tr)&&e.g===0&&e.q&&e.c.slice(0,4).every(Boolean);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const subjOf=e=>{const s=[...e.sn][0];return s||'อื่น ๆ';};
function examPool(subj,onlyWrong){ return E.filter(e=>examOK(e)&&(!subj||e.sn.has(subj))&&(!onlyWrong||WRONG.has(e.id))); }
function fmtTime(s){s=Math.max(0,Math.round(s));const m=Math.floor(s/60),r=s%60;return m+':'+String(r).padStart(2,'0');}
function renderExamSetup(){
  const box=$('#p-exam'); clearInterval(exTimer); EX=null;
  const hist=LS.get('kw-hist-v1',[]), sub=LS.get('kw-subj-v1',{});
  const names=[...new Set(Object.values(SETS))].sort((a,b)=>a.localeCompare(b));
  let h='<div class="card"><h2 style="margin:0 0 4px;font-size:1.1rem">โหมดสอบจำลอง</h2><p class="count" style="margin:0">สุ่มข้อที่มีเฉลยยืนยันแล้ว ทำจนจบแล้วดูคะแนนและข้อที่ผิด ข้อที่เคยผิดจะถูกจำไว้ให้ฝึกซ้ำ</p><div class="frm">';
  h+='<label>วิชา<select id="exSubj"><option value="">ทุกวิชา</option>'+names.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('')+'</select></label>';
  h+='<label>จำนวนข้อ<select id="exN"><option>10</option><option selected>20</option><option>40</option><option>60</option></select></label>';
  h+='<label>เวลา<select id="exT"><option value="0">ไม่จับเวลา</option><option value="1">1 นาทีต่อข้อ</option><option value="1.5" selected>1.5 นาทีต่อข้อ</option><option value="2">2 นาทีต่อข้อ</option></select></label>';
  h+='<label class="chk"><input type="checkbox" id="exWrong"> เฉพาะข้อที่เคยทำผิด ('+WRONG.size+')</label></div>';
  h+='<p class="count" id="exAvail"></p><button class="primary" id="exStart" type="button">เริ่มสอบ</button></div>';
  if(hist.length){
    const tn=hist.reduce((a,x)=>a+x.n,0), tk=hist.reduce((a,x)=>a+x.ok,0);
    h+='<div class="card"><h2 style="margin:0 0 6px;font-size:1rem">สถิติของคุณ (ในเบราว์เซอร์นี้)</h2><p class="count" style="margin:0 0 8px">สอบแล้ว '+hist.length+' ครั้ง · ตอบถูกรวม '+tk+' จาก '+tn+' ข้อ ('+Math.round(100*tk/Math.max(1,tn))+'%)</p>';
    const rows=Object.entries(sub).sort((a,b)=>(a[1].ok/a[1].n)-(b[1].ok/b[1].n));
    if(rows.length) h+='<div class="tblwrap"><table><thead><tr><th>วิชา (เรียงจากอ่อนสุด)</th><th class="r">ถูก/ทำ</th><th class="r">%</th></tr></thead><tbody>'+rows.map(([n,v])=>'<tr><td>'+esc(n)+'</td><td class="r">'+v.ok+'/'+v.n+'</td><td class="r">'+Math.round(100*v.ok/Math.max(1,v.n))+'%</td></tr>').join('')+'</tbody></table></div>';
    h+='<div class="row"><button class="ghost" id="exReset" type="button">ล้างสถิติ</button></div></div>';
  }
  box.innerHTML=h;
  const upd=()=>{ const n=examPool($('#exSubj').value,$('#exWrong').checked).length; $('#exAvail').textContent='ข้อที่เข้าเงื่อนไข '+n.toLocaleString('th-TH')+' ข้อ'; $('#exStart').disabled=n===0; };
  ['#exSubj','#exWrong'].forEach(s=>$(s).addEventListener('change',upd)); upd();
  $('#exStart').onclick=()=>startExam($('#exSubj').value,+$('#exN').value,parseFloat($('#exT').value),$('#exWrong').checked);
  const rs=$('#exReset'); if(rs) rs.onclick=()=>{ if(confirm('ล้างสถิติและรายการข้อที่เคยผิดทั้งหมด?')){LS.set('kw-hist-v1',[]);LS.set('kw-subj-v1',{});LS.set('kw-wrong-v1',[]);WRONG=new Set();renderExamSetup();} };
}
function startExam(subj,n,perQ,onlyWrong){
  const pool=shuffle(examPool(subj,onlyWrong)); if(!pool.length){toast('ไม่มีข้อที่เข้าเงื่อนไข');return;}
  const qs=pool.slice(0,Math.min(n,pool.length));
  EX={qs,ans:qs.map(()=>0),idx:0,t0:Date.now(),limit:perQ?Math.round(perQ*60*qs.length):0,done:false};
  clearInterval(exTimer); exTimer=setInterval(tickExam,1000); renderExamQ();
}
function tickExam(){
  if(!EX||EX.done){clearInterval(exTimer);return;}
  const el=$('#exClock'); if(!el) return; const used=(Date.now()-EX.t0)/1000;
  if(EX.limit){ const left=EX.limit-used; el.textContent='เหลือ '+fmtTime(left); el.classList.toggle('low',left<60); if(left<=0){ finishExam(true); } }
  else el.textContent='ใช้เวลา '+fmtTime(used);
}
function renderExamQ(){
  const box=$('#p-exam'), i=EX.idx, e=EX.qs[i], n=EX.qs.length, done=EX.ans.filter(Boolean).length;
  let h='<div class="exbar"><span>ข้อ '+(i+1)+' / '+n+'</span><span class="clock" id="exClock"></span><button class="ghost" id="exSubmit" type="button">ส่งข้อสอบ ('+done+'/'+n+')</button></div>';
  h+='<div class="prog"><i style="width:'+Math.round(100*(i+1)/n)+'%"></i></div>';
  h+='<article class="card"><div class="stem" style="margin-top:0">'+esc(e.q)+'</div><div class="choices">'+e.c.slice(0,4).map((c,k)=>'<button class="opt'+(EX.ans[i]===k+1?' sel':'')+'" data-k="'+(k+1)+'" type="button"><span class="no">'+(k+1)+'</span><span class="tx">'+esc(c)+'</span></button>').join('')+'</div></article>';
  h+='<div class="row"><button class="ghost" id="exPrev" type="button"'+(i===0?' disabled':'')+'>ก่อนหน้า</button><button class="primary" id="exNext" type="button">'+(i===n-1?'ตรวจทานแล้วส่ง':'ถัดไป')+'</button></div>';
  h+='<div class="pal">'+EX.qs.map((_,k)=>'<button type="button" data-go="'+k+'" class="'+(EX.ans[k]?'done ':'')+(k===i?'cur':'')+'" aria-label="ไปข้อ '+(k+1)+'">'+(k+1)+'</button>').join('')+'</div>';
  box.innerHTML=h; tickExam();
  box.querySelectorAll('button.opt').forEach(b=>b.onclick=()=>{ EX.ans[i]=(EX.ans[i]===+b.dataset.k)?0:+b.dataset.k; renderExamQ(); });
  box.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{EX.idx=+b.dataset.go;renderExamQ();window.scrollTo({top:0});});
  $('#exPrev').onclick=()=>{ if(EX.idx>0){EX.idx--;renderExamQ();window.scrollTo({top:0});} };
  $('#exNext').onclick=()=>{ if(EX.idx<n-1){EX.idx++;renderExamQ();window.scrollTo({top:0});} else finishExam(false); };
  $('#exSubmit').onclick=()=>finishExam(false);
}
function finishExam(timeUp){
  if(!EX||EX.done) return;
  const left=EX.ans.filter(a=>!a).length;
  if(!timeUp&&left&&!confirm('ยังไม่ได้ตอบอีก '+left+' ข้อ ส่งข้อสอบเลยไหม?')) return;
  EX.done=true; clearInterval(exTimer);
  const secs=Math.round((Date.now()-EX.t0)/1000), n=EX.qs.length; let ok=0; const per={};
  EX.qs.forEach((e,i)=>{ const s=subjOf(e); per[s]=per[s]||{n:0,ok:0}; per[s].n++; const right=EX.ans[i]===e.a; if(right){ok++;per[s].ok++;WRONG.delete(e.id);} else WRONG.add(e.id); });
  const hist=LS.get('kw-hist-v1',[]); hist.push({t:Date.now(),n,ok,sec:secs}); LS.set('kw-hist-v1',hist.slice(-50));
  const sub=LS.get('kw-subj-v1',{}); Object.entries(per).forEach(([s,v])=>{sub[s]=sub[s]||{n:0,ok:0};sub[s].n+=v.n;sub[s].ok+=v.ok;}); LS.set('kw-subj-v1',sub); LS.set('kw-wrong-v1',[...WRONG]);
  renderExamResult(ok,n,secs,per,timeUp);
}
function renderExamResult(ok,n,secs,per,timeUp){
  const box=$('#p-exam'), pct=Math.round(100*ok/n);
  let h='<div class="card hero"><div class="big">'+ok+' / '+n+' <span class="pill '+(pct>=60?'ok':'bad')+'">'+pct+'%</span></div><div class="count" style="margin:0">ใช้เวลา '+fmtTime(secs)+(timeUp?' (หมดเวลา)':'')+'</div></div>';
  h+='<div class="card"><div class="tblwrap"><table><thead><tr><th>วิชา</th><th class="r">ถูก/ทำ</th></tr></thead><tbody>'+Object.entries(per).map(([s,v])=>'<tr><td>'+esc(s)+'</td><td class="r">'+v.ok+'/'+v.n+'</td></tr>').join('')+'</tbody></table></div>';
  h+='<div class="row"><button class="primary" id="exAgain" type="button">ทำข้อสอบใหม่</button><button class="ghost" id="exWrongOnly" type="button">ฝึกเฉพาะข้อที่ผิด</button></div></div>';
  const bad=EX.qs.map((e,i)=>[e,i]).filter(([e,i])=>EX.ans[i]!==e.a);
  h+='<h2 style="font-size:1.05rem;margin:16px 0 8px">'+(bad.length?'ข้อที่ผิดหรือไม่ได้ตอบ ('+bad.length+')':'ตอบถูกทุกข้อ ยอดเยี่ยม!')+'</h2>';
  h+=bad.map(([e,i])=>'<p class="sc">'+(EX.ans[i]?'คุณตอบข้อ '+EX.ans[i]:'ไม่ได้ตอบ')+'</p>'+card(e,null)).join('');
  box.innerHTML=h; window.scrollTo({top:0});
  $('#exAgain').onclick=renderExamSetup;
  $('#exWrongOnly').onclick=()=>{ renderExamSetup(); const c=$('#exWrong'); if(c){c.checked=true;c.dispatchEvent(new Event('change'));} };
}

/* ---------- tabs ---------- */
let tab='search';
function switchTab(name){
  tab=name;
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab===name));
  ['search','practice','exam','marks','about'].forEach(k=>$('#p-'+k).hidden=(k!==name));
  $('#filters').hidden=!(name==='search'||name==='practice');
  $('#searchRow').hidden=$('#searchOpts').hidden=(name!=='search');
  $('#practiceOpts').hidden=(name!=='practice');
  if(name==='practice') nextPractice();
  if(name==='marks') renderMarks();
  if(name==='exam'&&!EX) renderExamSetup();
  window.scrollTo({top:0});
}
document.querySelector('.tabs').addEventListener('click',ev=>{const b=ev.target.closest('.tab'); if(b) switchTab(b.dataset.tab);});
init().then(()=>{initCam();initExtras();openShared();});
</script>
